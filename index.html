<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F4">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Приставки и молекулы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#141D18; --ink-soft:#5D6A63; --line:#E0E7E2;
  --accent:#1F5E45; --accent-soft:#E4EEE8;
  --ok:#1B7A52; --ok-bg:#E3F2E9; --ok-line:#95D0B2;
  --no:#B03A31; --no-bg:#FAE8E5; --no-line:#EBA79F;
  --shadow:0 1px 1px rgba(20,29,24,.04), 0 6px 20px rgba(20,29,24,.05);
  --ui:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --word:"PT Serif",Georgia,"Times New Roman",serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--ui);
  padding:0 0 env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:23px;line-height:1.2;margin:6px 0 2px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;max-width:42ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- главный экран ---------- */
.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease}
.tile:active{transform:scale(.985)}
.tile .t{font-size:18px;font-weight:600;letter-spacing:-.01em}
.tile .d{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.tile .n{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.stats{display:flex;gap:8px;margin:16px 0 4px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink-soft)}

/* ---------- список режимов ---------- */
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.mode:active{background:#EFF3F0}
.mode .mt{font-weight:500;font-size:15.5px}
.mode .mc{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}

/* ---------- тренажёр ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid var(--line);background:var(--card);border-radius:11px;width:36px;height:36px;
  font-size:17px;line-height:1;cursor:pointer;color:var(--ink-soft);flex:none}
.bar{flex:1;height:7px;background:#DFE7E2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}

.qcard{padding:20px 18px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;margin-bottom:12px}
.tag.dz{color:#8A5A12;background:#FBF0DC}
.word{font-family:var(--word);font-size:25px;font-weight:700;letter-spacing:-.005em;line-height:1.2;margin:0 0 9px}
.claim{font-size:16.5px;line-height:1.55;max-width:44ch}
.chemq{font-size:17px;line-height:1.5;font-weight:500;max-width:44ch}
.hint{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* ---------- кнопки ответа ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:16px 12px;
  font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;color:var(--ink);
  transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pick{border-color:var(--accent);background:var(--accent-soft)}
.btn.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.btn.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.btn[disabled]{cursor:default}
.opts .btn{width:100%;text-align:left;margin-bottom:9px;font-weight:500;font-size:16px;padding:14px 15px;display:block}
.numrow{display:flex;gap:9px}
.numrow input{flex:1;min-width:0;font:inherit;font-size:19px;font-weight:600;padding:14px 16px;border-radius:15px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.numrow input:focus{outline:none;border-color:var(--accent)}
.numrow input.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.numrow input.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.go{border:none;background:var(--accent);color:#fff;border-radius:15px;padding:14px 22px;font:inherit;
  font-size:16px;font-weight:600;cursor:pointer;flex:none}
.go:active{transform:scale(.97)}
.wide{width:100%;margin-top:12px}

/* ---------- разбор ---------- */
.fb{border-radius:var(--r);padding:15px 17px;margin-top:14px;border:1px solid;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--no-bg);border-color:var(--no-line)}
.fb .h{font-weight:700;font-size:15.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.fb.ok .h{color:var(--ok)} .fb.no .h{color:var(--no)}
.fb .b{font-size:15px;line-height:1.55}
.fb .right{margin-top:8px;font-size:15px}
.fb .right b{font-weight:700}

/* ---------- итоги ---------- */
.score{text-align:center;padding:26px 18px}
.score .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .pct{color:var(--ink-soft);margin-top:6px;font-size:14.5px}
.ghost{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;
  padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.mist{padding:14px 16px;margin-bottom:9px;font-size:14.5px;line-height:1.5}
.mist b{display:block;margin-bottom:3px}
.mist .m{color:var(--no);font-size:13.5px;margin-top:5px}
.hide{display:none!important}
.foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:22px;line-height:1.6}
</style>

<div class="wrap">
  <!-- ГЛАВНАЯ -->
  <div id="home">
    <h1>Приставки и молекулы</h1>
    <p class="sub">Два раздела к завтрашнему дню: приставки в задании 5 ОГЭ и повторение химии за 8 класс.</p>

    <button class="tile" data-go="rus">
      <div class="t">Русский язык</div>
      <div class="d">Правописание приставок. Верно или неверно объяснено написание слова.</div>
      <div class="n" id="nrus"></div>
    </button>

    <button class="tile" data-go="chem">
      <div class="t">Химия, 8 класс</div>
      <div class="d">Повторение: ОВР, степени окисления, классы веществ, строение атома, задачи.</div>
      <div class="n" id="nchem"></div>
    </button>

    <div class="stats">
      <div class="stat"><b id="s-all">0</b><span>решено всего</span></div>
      <div class="stat"><b id="s-pct">—</b><span>верных</span></div>
      <div class="stat"><b id="s-err">0</b><span>в ошибках</span></div>
    </div>
    <button class="ghost" id="resetBtn">Сбросить статистику</button>
    <div class="foot">Задания 5 взяты из открытого банка ФИПИ и дополнены по теории учителя.</div>
  </div>

  <!-- ВЫБОР РЕЖИМА -->
  <div id="modes" class="hide">
    <div class="top"><button class="back" data-back>‹</button><h2 id="mtitle" style="margin:0"></h2></div>
    <div id="mlist"></div>
  </div>

  <!-- ТРЕНАЖЁР -->
  <div id="quiz" class="hide">
    <div class="top">
      <button class="back" data-back>‹</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="count" id="cnt"></div>
    </div>
    <div class="card qcard" id="qbody"></div>
    <div id="answers"></div>
    <div id="fb"></div>
    <button class="go wide hide" id="next">Следующее задание</button>
  </div>

  <!-- ИТОГИ -->
  <div id="done" class="hide">
    <div class="card score">
      <div class="big" id="fscore"></div>
      <div class="pct" id="fpct"></div>
    </div>
    <button class="go wide" id="againErr">Работа над ошибками</button>
    <button class="ghost" id="again">Пройти ещё раз</button>
    <button class="ghost" id="toHome">На главную</button>
    <div id="mistakes" style="margin-top:20px"></div>
  </div>
</div>

<script>
 /* ===== данные ===== */
 const RUS = [{"id":1,"word":"РАЗЖЕЧЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «ж», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":2,"word":"(кофе) ПО-ВОСТОЧНОМУ","claim":"Наречия на -ОМУ с приставкой ПО- пишутся через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":true},{"id":3,"word":"БЕЗЫМЯННЫЙ","claim":"после приставки, оканчивающейся на согласный, в корне сохраняется буква И.","ok":false,"expl":"После русской приставки на согласный пишется Ы, а не И: БЕЗЫМЯННЫЙ. Букву И сохраняют только МЕЖ- и СВЕРХ-, иноязычные приставки (контр-, суб-, транс-, пан-, супер-, дез-), числительные ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и сложносокращённые слова.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":4,"word":"ПРИФРОНТОВОЙ (участок)","claim":"правописание приставки определяется её значением — близость.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренировка","dz":true},{"id":5,"word":"РАСЧЕРТИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «ч», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":6,"word":"ПОЛГОДА","claim":"слово пишется слитно, потому что после ПОЛ- стоит согласная буква (кроме Л).","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":7,"word":"ПОЛКОМНАТЫ","claim":"слово пишется через дефис, потому что начинается с ПОЛ-.","ok":false,"expl":"ПОЛКОМНАТЫ пишется слитно: после ПОЛ- стоит согласная (не Л), вторая часть — не имя собственное. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":8,"word":"ПРЕСЕЧЬ (спор)","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":false,"expl":"Значение указано неверно: здесь не «высшая степень качества, близкое к слову «очень»». В слове ПРЕСЕЧЬ (спор) приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":9,"word":"БЕССМЕРТНЫЙ (подвиг)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «с», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":10,"word":"ПРИШКОЛЬНЫЙ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":11,"word":"ВПРАВО","claim":"написание суффикса -О в наречии определяется наличием приставки В-.","ok":true,"expl":"Верно. Приставка определяет суффикс наречия: с приставками ИЗ-, ДО-, С- пишется суффикс -А (издавна, досуха, слева), с приставками В-, НА-, ЗА- — суффикс -О (вправо, начисто, засветло).","rule":"суффикс наречия","src":"ФИПИ","dz":false},{"id":12,"word":"ПОЛ-ЕВРОПЫ","claim":"слово пишется через дефис, потому что вторая часть — имя собственное и пишется с прописной буквы.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":13,"word":"ПОЛ-ЯБЛОКА","claim":"слово пишется через дефис, потому что после пол- стоит гласная буква.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"ФИПИ","dz":false},{"id":14,"word":"НИСХОДЯЩАЯ (линия)","claim":"в слове приставка НИС-, которая пишется всегда одинаково независимо от произношения.","ok":false,"expl":"Приставка пишется с буквой С на конце, потому что корень начинается с глухого согласного (сравни: низвергнуть).","rule":"prochee","src":"ФИПИ","dz":false},{"id":15,"word":"ДЕЗОРГАНИЗАЦИЯ","claim":"пишется приставка ДИС- со значением отсутствия.","ok":false,"expl":"В слове ДЕЗОРГАНИЗАЦИЯ приставка ДЕЗ- (уничтожение, удаление, отсутствие). ДИС- — в словах дисбаланс, дисгармония.","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":16,"word":"НИКОГО","claim":"в отрицательном местоимении без ударения пишется приставка НИ-.","ok":true,"expl":"Верно. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":17,"word":"(дорог) ПО-ПРЕЖНЕМУ","claim":"наречие, образованное от основы имени прилагательного с помощью приставки ПО- и суффикса -ЕМУ-, пишется через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":18,"word":"НЕСКОЛЬКО","claim":"в неопределённом местоимении в безударной позиции пишется приставка НЕ-.","ok":false,"expl":"В данном слове приставка НЕ ударная, поэтому Е.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":19,"word":"ПОЛУКРУГ","claim":"слово с ПОЛУ- пишется слитно.","ok":true,"expl":"Верно. ПОЛУ- всегда пишется слитно: полумрак, полумера, полуфинал.","rule":"пол","src":"Тренажёр","dz":false},{"id":20,"word":"СБИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"В слове СБИТЬ приставка С- — неизменяемая, она состоит из одной буквы и пишется всегда одинаково. Приставки З- не существует. Правило про глухой/звонкий работает только для приставок на -З/-С.","rule":"з-с","src":"Тренировка","dz":true}];

 function shuffle(a){
     a = a.slice();
     for(let i=a.length-1;i>0;i--){
         const j=Math.random()*(i+1)|0;
         [a[i],a[j]]=[a[j],a[i]];
     }
     return a;
 }

 function esc(s){
     return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 }
