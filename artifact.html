емая, её написание нужно запомнить. Приставки З- в русском языке не существует.","rule":"з-с","src":"Тренировка","dz":false},{"id":124,"word":"ПРИШКОЛЬНЫЙ (участок)","claim":"Приставка ПРИ- пишется в значении неполноты действия.","ok":false,"expl":"Значение указано неверно. ПРИ- здесь обозначает расположение вблизи (участок около школы), а не неполноту действия.","rule":"пре-при","src":"Тренировка","dz":true},{"id":125,"word":"(встретиться) ПО-ДРУЖЕСКИ","claim":"наречия на -И, -СКИ с приставкой ПО- пишутся через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":126,"word":"ПРЕЗИДЕНТ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":false,"expl":"ПРЕЗИДЕНТ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":127,"word":"РАСХОДИТЬСЯ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква приставки названа верно (С), но звук — нет: «х» обозначает глухой согласный, а не звонкий. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":128,"word":"ПРИШИТЬ (пуговицу)","claim":"написание приставки определяется её значением — приближение.","ok":false,"expl":"Значение указано неверно: здесь не «приближение». В слове ПРИШИТЬ (пуговицу) приставка ПРИ- имеет значение «присоединение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":129,"word":"ИСЧЕЗАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Приставка оканчивается на С, потому что дальше стоит буква «ч», обозначающая глухой согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":130,"word":"СЖАТЬ","claim":"приставка С- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. С- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":131,"word":"РАЗЫГРА́ТЬ","claim":"в приставке под ударением пишется буква А.","ok":false,"expl":"В слове РАЗЫГРА́ТЬ приставка безударная — именно поэтому А. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":132,"word":"ПРЕРВАТЬ","claim":"правописание приставки определяется её значением, близким к значению слова очень.","ok":false,"expl":"Правописание приставки определяется её значением, близким к значению ПЕРЕ.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":133,"word":"ПОДДЕРЖИВАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Д.","ok":false,"expl":"Приставка ПОД- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ПОТ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":134,"word":"ДВУХЪЯЗЫЧНЫЙ","claim":"разделительный Ъ пишется после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","ok":true,"expl":"Верно. ДВУХЪЯЗЫЧНЫЙ: после числительных ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед Е, Ё, Ю, Я тоже пишется разделительный Ъ.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":135,"word":"НИКТО (не пришёл)","claim":"в отрицательном местоимении под ударением пишется приставка НИ-.","ok":false,"expl":"В слове «никто́» приставка НИ- является безударной, а не ударной. Именно в безударном положении в отрицательных местоимениях пишется НИ-, тогда как под ударением пишется НЕ- (ср.: не́кто, не́что).","rule":"местоимения","src":"ФИПИ","dz":false},{"id":136,"word":"ПРОТОТИП","claim":"пишется приставка ПРО-, потому что она обозначает то, что служит основой (или замещение должности).","ok":true,"expl":"Верно. ПРОТОТИП: ПРО-, а не ПРА-. ПРА- бывает только в значении «предшествующий»: прабабушка, праязык.","rule":"пра-про","src":"Тренажёр","dz":false},{"id":137,"word":"РАСЦЕНИВАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «ц», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"Тренировка","dz":true},{"id":138,"word":"НИЗВЕРГНУТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Буква приставки названа верно (З), но звук — нет: «в» обозначает звонкий согласный, а не глухой. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":139,"word":"ПРЕЗАБАВНЫЙ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"Значение указано неверно: здесь не «значение, близкое к значению приставки ПЕРЕ-». В слове ПРЕЗАБАВНЫЙ приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":140,"word":"НЕКТО","claim":"в неопределённом местоимении под ударением пишется приставка НЕ-.","ok":true,"expl":"Верно. Под ударением в местоимении пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́). КОЕ-, -ТО, -ЛИБО, -НИБУДЬ дают дефис, но при предлоге КОЕ- пишется отдельно: кое у кого.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":141,"word":"ПРИЩУРИТЬ (глаза)","claim":"написание приставки определяется её значением — приближение.","ok":false,"expl":"Приставка ПРИ- в данном слове обозначает неполноту действия (слегка прикрыть глаза, а не закрыть полностью), а не приближение.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":142,"word":"ВОСПИТАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Приставка оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":143,"word":"ПОДПИЛИТЬ","claim":"приставка ПОД- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. ПОД- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":144,"word":"НЕКОТОРЫЙ","claim":"в неопределённом местоимении без ударения пишется приставка НЕ-.","ok":false,"expl":"Приставка НЕ в неопределённом местоимении пишется под ударением.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":145,"word":"ПРИБЕЖАТЬ","claim":"написание приставки определяется её значением — приближение.","ok":true,"expl":"Верно. В слове ПРИБЕЖАТЬ приставка ПРИ- имеет значение «приближение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":146,"word":"ПОЛ-АФРИКИ","claim":"слово пишется через дефис, потому что вторая часть — имя собственное и пишется с прописной буквы.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":147,"word":"ИЗРЕДКА","claim":"правописание суффикса -А в наречии определяется наличием приставки ИЗ-.","ok":true,"expl":"Верно. Приставка определяет суффикс наречия: с приставками ИЗ-, ДО-, С- пишется суффикс -А (издавна, досуха, слева), с приставками В-, НА-, ЗА- — суффикс -О (вправо, начисто, засветло).","rule":"суффикс наречия","src":"ФИПИ","dz":false},{"id":148,"word":"РАССЧИТАТЬ","claim":"перед корнем -ЧИТ- пишется одна буква С.","ok":false,"expl":"В слове раССчитать две С: приставка РАС- + корень -СЧИТ-. Одна С — только в слове раСчёт.","rule":"расчёт","src":"Тренажёр","dz":false},{"id":149,"word":"ПРЕВРАТИТЬ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":true,"expl":"Верно. В слове ПРЕВРАТИТЬ приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":150,"word":"СБЕРЕЧЬ","claim":"приставка С- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. С- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":151,"word":"(говорил) ПО-АНГЛИЙСКИ","claim":"наречие пишется через дефис, потому что оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":152,"word":"ПРЕДЫДУЩИЙ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":153,"word":"ПРЕМИЛЫЙ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":true,"expl":"Верно. В слове ПРЕМИЛЫЙ приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":154,"word":"ИСХОД","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Звук определён верно (глухой), но буква не та: перед глухой согласным пишется С, а не З. В слове ИСХОД приставка оканчивается на С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":155,"word":"ПОЛ-УРОКА","claim":"слово пишется через дефис, потому что после пол- стоит буква, обозначающая гласный звук.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"ФИПИ","dz":false},{"id":156,"word":"ПРЕМУДРЫЙ","claim":"написание приставки определяется её значением, близким к значению приставки пере-.","ok":false,"expl":"Значение указано неверно: здесь ПРЕ- = «очень» (премудрый — очень мудрый), а не значение приставки ПЕРЕ-.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":157,"word":"БЕЗЖАЛОСТНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «ж», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":158,"word":"(говорит) ПО-ГРУЗИНСКИ","claim":"написание наречия через дефис определяется наличием приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":159,"word":"ПРЕДЫДУЩИЙ","claim":"после приставки, оканчивающейся на согласный, в корне сохраняется буква И.","ok":false,"expl":"После русской приставки на согласный пишется Ы, а не И: ПРЕДЫДУЩИЙ. Букву И сохраняют только МЕЖ- и СВЕРХ-, иноязычные приставки (контр-, суб-, транс-, пан-, супер-, дез-), числительные ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и сложносокращённые слова.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":160,"word":"МЕЖИНСТИТУТСКИЙ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"МЕЖИНСТИТУТСКИЙ: приставка СВЕРХ-/МЕЖ- — исключение из правила. После неё пишется И, а не Ы.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":161,"word":"БЕСКОНЕЧНО (долго)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «к», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":162,"word":"НЕКИЙ","claim":"в местоимении под ударением пишется приставка НЕ-.","ok":true,"expl":"Верно. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":163,"word":"ПРИБИТЬ (доску)","claim":"написание приставки определяется её значением — присоединение.","ok":true,"expl":"Верно. В слове ПРИБИТЬ (доску) приставка ПРИ- имеет значение «присоединение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":164,"word":"ДЕЗИНФЕКЦИЯ","claim":"пишется приставка ДИС- со значением отсутствия.","ok":false,"expl":"В слове ДЕЗИНФЕКЦИЯ приставка ДЕЗ- (уничтожение, удаление, отсутствие). ДИС- — в словах дисбаланс, дисгармония.","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":165,"word":"ПОЛУАВТОМАТ","claim":"слова с ПОЛУ- пишутся слитно.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренировка","dz":false},{"id":166,"word":"СУПЕРИГРА","claim":"после приставки иноязычного происхождения, оканчивающейся на согласный, пишется буква И.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":167,"word":"ДИСБАЛАНС","claim":"пишется приставка ДИС- со значением отсутствия, нарушения.","ok":true,"expl":"Верно. ДИС- = отсутствие/нарушение: дисбаланс. ДЕЗ- пишется в словах дезинформация, дезорганизация — «уничтожение, удаление».","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":168,"word":"ПРИУКРАСИТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Значение указано неверно: здесь не «присоединение». В слове ПРИУКРАСИТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":169,"word":"БЕЗЫМЯННЫЙ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":170,"word":"ПРИБРЕЖНЫЙ (песок)","claim":"написание приставки определяется её значением — совершение действия в чьих-либо интересах.","ok":false,"expl":"Значение указано неверно: здесь не «совершение действия в чьих-либо интересах». В слове ПРИБРЕЖНЫЙ (песок) приставка ПРИ- имеет значение «расположение вблизи». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":171,"word":"ПОДЫТОЖИТЬ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":172,"word":"ПРИВЕТСТВОВАТЬ","claim":"написание приставки определяется её значением — приближение.","ok":false,"expl":"ПРИВЕТСТВОВАТЬ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":173,"word":"БЕЗЗАБОТНЫЙ","claim":"сочетание -ЗЗ- получается на стыке приставки и корня.","ok":true,"expl":"Верно. БЕЗ- + ЗАБОТНЫЙ: приставка оканчивается на З, корень с З и начинается. Так же беССмысленный (БЕС- + СМЫСЛ).","rule":"расчёт","src":"Тренажёр","dz":false},{"id":174,"word":"ПРИВОКЗАЛЬНАЯ (площадь)","claim":"Приставка ПРИ- пишется в значении неполноты действия.","ok":false,"expl":"Значение указано неверно. Приставка ПРИ- здесь обозначает расположение вблизи (площадь около вокзала), а не неполноту действия.","rule":"пре-при","src":"Тренировка","dz":true},{"id":175,"word":"ПРЕГРАДА","claim":"написание приставки определяется её значением, близким к значению приставки пере-.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":176,"word":"ОТТОЧИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.","ok":false,"expl":"Приставка ОТ- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ОД- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":177,"word":"ПРЕЛОМИТЬ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":false,"expl":"Значение указано неверно: здесь не «высшая степень качества, близкое к слову «очень»». В слове ПРЕЛОМИТЬ приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":178,"word":"КАКОЙ-НИБУДЬ","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"КАКОЙ-НИБУДЬ пишется через дефис. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":179,"word":"ВОРОБЬИ","claim":"разделительный Ъ пишется перед буквой, обозначающей два звука.","ok":false,"expl":"В слове ВОРОБЬИ приставки нет, поэтому пишется разделительный Ь, а не Ъ. Ъ бывает только после приставки на согласный (и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ-).","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":180,"word":"ПРИБЕРЕЧЬ","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Приставка ПРИ- в данном слове имеет значение совершения действия в чьих-либо интересах (или доведения действия до конца/результата). Значения «присоединение» (как в словах пришить, приклеить) здесь нет.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":181,"word":"ОТПИЛИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.","ok":false,"expl":"Приставка ОТ- является неизменяемой, её написание нужно запомнить. Оно не зависит от глухости или звонкости последующего согласного (отпилить, отбить). Приставки ОД- в русском языке не существует.","rule":"з-с","src":"ФИПИ","dz":false},{"id":182,"word":"ВЗБУДОРАЖЕНЫ (известием)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Звук назван неверно: буква Б обозначает звонкий согласный. Именно поэтому на конце приставки пишется З. Перед глухим писалась бы С (вспомнить, вскрикнуть).","rule":"з-с","src":"Тренировка","dz":true},{"id":183,"word":"БЕСЦЕЛЬНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"В этом слове приставка оканчивается на С, потому что корень начинается с глухого согласного звука, а не со звонкого.","rule":"з-с","src":"ФИПИ","dz":true},{"id":184,"word":"ПРЕСПОКОЙНО","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"Значение указано неверно: здесь не «значение, близкое к значению приставки ПЕРЕ-». В слове ПРЕСПОКОЙНО приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":185,"word":"ПОЛ-АРБУЗА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":false,"expl":"После ПОЛ- в слове ПОЛ-АРБУЗА стоит гласная, а не Л. Дефис здесь именно из-за гласной. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":186,"word":"СВЕРХИНТЕРЕСНЫЙ","claim":"после приставок МЕЖ- и СВЕРХ- пишется буква И.","ok":true,"expl":"Верно. СВЕРХИНТЕРЕСНЫЙ: МЕЖ- и СВЕРХ- — исключения, после них И сохраняется (иначе получилось бы «межы», «сверхы»).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":187,"word":"ПОДБРОСИТЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква Д.","ok":false,"expl":"Приставка ПОД- является неизменяемой, её написание нужно просто запомнить. Оно не зависит от звонкости или глухости последующего согласного (подбросить, подкинуть). Приставки ПОТ- в русском языке не существует.","rule":"з-с","src":"ФИПИ","dz":false},{"id":188,"word":"ВО-ПЕРВЫХ","claim":"числительное пишется через дефис с приставкой ВО-.","ok":false,"expl":"ВО-ПЕРВЫХ — не числительное, а наречие (вводное слово). Дефис ставится потому, что наречие образовано от порядкового числительного при помощи приставки ВО- и суффикса -ЫХ.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":189,"word":"ПОЛУМРАК","claim":"слово с ПОЛУ- пишется слитно.","ok":true,"expl":"Верно. ПОЛУ- всегда пишется слитно: полумрак, полумера, полуфинал.","rule":"пол","src":"Тренажёр","dz":false},{"id":190,"word":"ДОПИСАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква О.","ok":false,"expl":"Приставка ДО- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ДА- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":191,"word":"ПРИДОРОЖНЫЙ (столб)","claim":"написание приставки определяется её значением — расположение вблизи.","ok":true,"expl":"Верно. В слове ПРИДОРОЖНЫЙ (столб) приставка ПРИ- имеет значение «расположение вблизи». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":192,"word":"ПРЕИНТЕРЕСНАЯ (книга)","claim":"приставка ПРЕ- пишется в значении ОЧЕНЬ.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"Тренировка","dz":true},{"id":193,"word":"СОЛОВЬИ","claim":"разделительный Ъ пишется перед буквой, обозначающей два звука.","ok":false,"expl":"В слове СОЛОВЬИ приставки нет, поэтому пишется разделительный Ь, а не Ъ. Ъ бывает только после приставки на согласный (и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ-).","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":194,"word":"СДЕЛАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"Приставка С- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки З- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":195,"word":"ПРИОЗЁРНЫЙ (посёлок)","claim":"написание приставки определяется её значением — расположение вблизи.","ok":true,"expl":"Верно. В слове ПРИОЗЁРНЫЙ (посёлок) приставка ПРИ- имеет значение «расположение вблизи». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":196,"word":"НЕСКОЛЬКО","claim":"в местоимении без ударения пишется приставка НЕ-.","ok":false,"expl":"Наоборот: в слове НЕСКОЛЬКО приставка НЕ- ударная. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":197,"word":"(говорить) ПО-ФРАНЦУЗСКИ","claim":"наречие пишется через дефис, потому что оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":true},{"id":198,"word":"ПОЛ-ЯБЛОКА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":false,"expl":"После ПОЛ- в слове ПОЛ-ЯБЛОКА стоит гласная, а не Л. Дефис здесь именно из-за гласной. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":199,"word":"НЕКОГО (винить)","claim":"в отрицательных местоимениях под ударением пишется приставка НЕ-.","ok":true,"expl":"Верно. Под ударением в местоимении пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́). КОЕ-, -ТО, -ЛИБО, -НИБУДЬ дают дефис, но при предлоге КОЕ- пишется отдельно: кое у кого.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":200,"word":"ПРИГЛУШИТЬ (звук)","claim":"написание приставки определяется её значением — неполнота действия.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":201,"word":"(общались) ПО-СВОЙСКИ","claim":"наречие пишется через дефис, так как оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":202,"word":"ПО-ДРУГОМУ","claim":"наречия с приставкой ПО- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: подолгу, понемногу пишутся слитно. Дефис нужен только при сочетании ПО- + -ОМУ/-ЕМУ/-И/-ЬИ, как в слове ПО-ДРУГОМУ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":203,"word":"ТРАНСИНДИЙСКИЙ","claim":"после приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"ТРАНСИНДИЙСКИЙ: приставка иноязычная, после неё пишется И, а не Ы. Ы пишется только после русских приставок на согласный.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":204,"word":"ПОДЫГРАТЬ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"Тренировка","dz":false},{"id":205,"word":"ПОДЫСКАТЬ","claim":"после приставки, оканчивающейся на согласный, в корне сохраняется буква И.","ok":false,"expl":"После русской приставки на согласный пишется Ы, а не И: ПОДЫСКАТЬ. Букву И сохраняют только МЕЖ- и СВЕРХ-, иноязычные приставки (контр-, суб-, транс-, пан-, супер-, дез-), числительные ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и сложносокращённые слова.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":206,"word":"ЗДРАВСТВУЙТЕ","claim":"Приставка неизменяемая.","ok":false,"expl":"В слове ЗДРАВСТВУЙТЕ приставки нет: З входит в корень -здравств-. Запоминать нужно само слово.","rule":"неизм","src":"Тренировка","dz":true},{"id":207,"word":"ПРЕЗИДИУМ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"ПРЕЗИДИУМ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":208,"word":"ПРИБОР","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"ПРИБОР — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":209,"word":"РАЗЪЯРЁННЫЙ","claim":"разделительный Ъ пишется после приставки перед любой гласной буквой.","ok":false,"expl":"Ъ пишется только перед Е, Ё, Ю, Я. Перед А, О, У, Ы, И, Э разделительный знак не нужен (сравните: подытожить, сэкономить). В слове РАЗЪЯРЁННЫЙ Ъ стоит именно перед Е, Ё, Ю или Я.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":210,"word":"ПОЛУОСТРОВ","claim":"слово пишется через дефис, потому что после ПОЛУ- стоит гласная буква.","ok":false,"expl":"ПОЛУ- всегда пишется слитно, никакого дефиса: ПОЛУОСТРОВ. Правило про гласную относится только к ПОЛ-.","rule":"пол","src":"Тренажёр","dz":false},{"id":211,"word":"РО́ЗЫГРЫШ","claim":"в приставке под ударением пишется буква О.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":212,"word":"БЕССЕРДЕЧНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Приставка оканчивается на С, потому что дальше стоит буква «с», обозначающая глухой согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":213,"word":"БЕСХИТРОСТНЫЙ","claim":"на конце приставки БЕС- всегда пишется буква С.","ok":false,"expl":"потому что есть и приставка БЕЗ-. Выбор между З/С зависит от глухости-звонкости звука, стоящего после приставки. В данном слове пишется БЕС- потому, что далее идёт буква «х», обозначающая глухой звук.","rule":"прочее","src":"ФИПИ","dz":false},{"id":214,"word":"ПОЛ-ЛИМОНА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":215,"word":"РАСПИЛИТЬ (материал)","claim":"на конце приставки перед буквой, обозначающий глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":216,"word":"ПО-АНГЛИЙСКИ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО- и суффикса -ОМУ.","ok":false,"expl":"Суффикс назван неверно: в слове ПО-АНГЛИЙСКИ суффикс -И (-ЬИ), а не -ОМУ. Дефис при этом всё равно нужен.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":217,"word":"ПО-НОВОМУ","claim":"наречие пишется через дефис, потому что образовано от основы имени прилагательного (местоимения) при помощи приставки ПО- и суффикса -ОМУ/-ЕМУ.","ok":true,"expl":"Верно. ПО-НОВОМУ: приставка ПО- + суффикс -ОМУ/-ЕМУ — пишем через дефис.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":218,"word":"ПРЕМУДРЫЙ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":true,"expl":"Верно. В слове ПРЕМУДРЫЙ приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":219,"word":"ПРИТОРМОЗИТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Значение указано неверно: здесь не «присоединение». В слове ПРИТОРМОЗИТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":220,"word":"ПО-ПРЕЖНЕМУ","claim":"наречия с приставкой ПО- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: подолгу, понемногу пишутся слитно. Дефис нужен только при сочетании ПО- + -ОМУ/-ЕМУ/-И/-ЬИ, как в слове ПО-ПРЕЖНЕМУ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":221,"word":"ПРЕСТИЖ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"ПРЕСТИЖ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":222,"word":"(находиться) ЗДЕСЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":false,"expl":"В слове ЗДЕСЬ приставки нет: З — часть корня. Приставки З- в русском языке не существует.","rule":"з-с","src":"Тренировка","dz":true},{"id":223,"word":"СТИХНЕТ (ветер)","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"В этом слове приставка С- неизменяемая.","rule":"з-с","src":"ФИПИ","dz":false},{"id":224,"word":"(объяснялся) ПО-НЕМЕЦКИ","claim":"наречие пишется через дефис, потому что оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":225,"word":"ПОЛ ФРУКТОВОГО САДА","claim":"сочетание пишется раздельно, потому что между ПОЛ- и существительным стоит ещё одно слово.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":226,"word":"РАСПИСАНИЕ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква приставки названа верно (С), но звук — нет: «п» обозначает глухой согласный, а не звонкий. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":227,"word":"ПРЕНЕПРИЯТНЫЙ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"Значение указано неверно: здесь не «значение, близкое к значению приставки ПЕРЕ-». В слове ПРЕНЕПРИЯТНЫЙ приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":228,"word":"ПО-СТАРОМУ","claim":"наречия с приставкой ПО- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: подолгу, понемногу пишутся слитно. Дефис нужен только при сочетании ПО- + -ОМУ/-ЕМУ/-И/-ЬИ, как в слове ПО-СТАРОМУ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":229,"word":"СЦЕПЛЕНИЕ","claim":"на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С.","ok":false,"expl":"Приставка С- в этом слове неизменяемая.","rule":"з-с","src":"ФИПИ","dz":false},{"id":230,"word":"ПРЕВОЗМОГАТЬ","claim":"приставка ПРЕ- пишется в значении ПЕРЕ-.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"Тренировка","dz":true},{"id":231,"word":"СЫГРАТЬ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. СЫГРАТЬ: русская приставка оканчивается на согласный, поэтому И в корне переходит в Ы. Исключения — приставки МЕЖ- и СВЕРХ- (сверхинтересный, межинститутский).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":232,"word":"ТРЁХИМПУЛЬСНЫЙ","claim":"после числительных ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- пишется буква И.","ok":true,"expl":"Верно. ТРЁХИМПУЛЬСНЫЙ: после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- буква И сохраняется.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":233,"word":"ИЗДАВНА","claim":"написание суффикса -А в наречии определяется наличием приставки ИЗ-.","ok":true,"expl":"Верно. Приставка определяет суффикс наречия: с приставками ИЗ-, ДО-, С- пишется суффикс -А (издавна, досуха, слева), с приставками В-, НА-, ЗА- — суффикс -О (вправо, начисто, засветло).","rule":"суффикс наречия","src":"ФИПИ","dz":false},{"id":234,"word":"ОБЪЯВЛЕНИЕ","claim":"разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквами Е, Ё, Ю, Я.","ok":true,"expl":"Верно. ОБЪЯВЛЕНИЕ: приставка оканчивается на согласный, а корень начинается с Е/Ё/Ю/Я — пишем разделительный Ъ.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":235,"word":"ЗДАНИЕ","claim":"в приставке перед буквой, обозначающей звонкий согласный, пишется буква З.","ok":false,"expl":"Однако к данному слову подобное правила никак нельзя применить, потому что приставки вообще нет.","rule":"з-с","src":"ФИПИ","dz":false},{"id":236,"word":"СПОРТИНВЕНТАРЬ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"СПОРТИНВЕНТАРЬ — сложносокращённое слово, а не слово с приставкой. В сложносокращённых словах пишется И.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":237,"word":"ПРИПЛЫТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":false,"expl":"Написание приставки определяется в этом слове значением «приближение».","rule":"пре-при","src":"ФИПИ","dz":false},{"id":238,"word":"ПРЕСТУПИТЬ (закон)","claim":"написание приставки определяется её значением, близким к слову очень.","ok":false,"expl":"Приставка ПРЕ- в данном слове имеет значение, близкое к приставке ПЕРЕ- (переступить, нарушить закон). Значения «очень» здесь нет.","rule":"пре-при","src":"ФИПИ","dz":true},{"id":239,"word":"СЛОЖИТЬ (оружие)","claim":"на конце приставки перед глухим согласным пишется буква С.","ok":false,"expl":"Приставка С- неизменяемая. К тому же буква Л обозначает звонкий звук, так что и условие в формулировке не выполняется.","rule":"з-с","src":"Тренировка","dz":true},{"id":240,"word":"СВЕРХИЗЫСКАННЫЙ","claim":"после иноязычной приставки, оканчивающейся на согласный, пишется буква И.","ok":false,"expl":"но в данном слове приставка СВЕРХ — русская, и после неё, как и после русской приставки МЕЖ, писать «ы» запрещено, иначе было бы «межы» и «сверхы».","rule":"ы-и","src":"ФИПИ","dz":false},{"id":241,"word":"СКАТИТЬСЯ","claim":"пишется приставка С-, потому что стоит перед буквой, обозначающей глухой согласный звук.","ok":false,"expl":"Приставка С неизменяемая.","rule":"з-с","src":"ФИПИ","dz":false},{"id":242,"word":"СКОРРЕКТИРОВАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"Приставка С- является неизменяемой, её написание нужно запомнить. Оно не зависит от глухости или звонкости последующего согласного (скорректировать, сбить). Приставки З- в русском языке не существует.","rule":"з-с","src":"ФИПИ","dz":false},{"id":243,"word":"ПРЕСТУПИТЬ (закон)","claim":"правописание приставки определяется её значением – очень.","ok":false,"expl":"Значение указано неверно. Здесь ПРЕ- близко по значению к приставке ПЕРЕ- (преступить закон = переступить, нарушить), а не «очень».","rule":"пре-при","src":"Тренировка","dz":true},{"id":244,"word":"ПРЕДПРАЗДНИЧНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Д.","ok":false,"expl":"Приставка ПРЕД- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ПРЕТ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":245,"word":"НЕ У КОГО","claim":"местоимение пишется раздельно, потому что между приставкой и местоимением стоит предлог.","ok":true,"expl":"Верно. НЕ У КОГО: НЕ/НИ отделены предлогом, поэтому пишем в три слова. Без предлога было бы слитно: никого, некому.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":246,"word":"ПРИУМОЛКНУТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":true,"expl":"Верно. В слове ПРИУМОЛКНУТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":247,"word":"БЕСПОЛЕЗНЫЙ (совет)","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"На конце приставки пишется буква С, потому что после неё стоит глухой согласный звук [п]. (Буква П не обозначает звонкий звук).","rule":"з-с","src":"ФИПИ","dz":false},{"id":248,"word":"ЧЕРЕСПОЛОСИЦА","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Приставка оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":249,"word":"ПРОРЕКТОР","claim":"пишется приставка ПРО-, потому что она обозначает то, что служит основой (или замещение должности).","ok":true,"expl":"Верно. ПРОРЕКТОР: ПРО-, а не ПРА-. ПРА- бывает только в значении «предшествующий»: прабабушка, праязык.","rule":"пра-про","src":"Тренажёр","dz":false},{"id":250,"word":"ЧРЕЗМЕРНОЕ (усердие)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"На конце приставки пишется буква З, потому что после неё стоит буква М, обозначающая звонкий (а не глухой) согласный звук.","rule":"з-с","src":"ФИПИ","dz":false},{"id":251,"word":"ПРЕОДОЛЕТЬ","claim":"приставка ПРЕ- пишется в значении ПЕРЕ-.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"Тренировка","dz":true},{"id":252,"word":"НЕИЗЪЯСНИМЫЙ","claim":"буква разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквой Я.","ok":true,"expl":"Верно. Разделительный Ъ пишется после приставки, оканчивающейся на согласный, и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","rule":"ъ-ь","src":"ФИПИ","dz":false},{"id":253,"word":"ПРЕУСПЕВАТЬ","claim":"написание приставки определяется её значением, близким к значению приставке пере-.","ok":false,"expl":"Значение указано неверно. Здесь ПРЕ- имеет значение высшей степени качества, близкое к слову «очень», а не значение приставки ПЕРЕ-.","rule":"пре-при","src":"Тренировка","dz":true},{"id":254,"word":"ПРИКЛЕИТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":true,"expl":"Верно. В слове ПРИКЛЕИТЬ приставка ПРИ- имеет значение «присоединение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":255,"word":"ВЪЕЗД","claim":"разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквами Е, Ё, Ю, Я.","ok":true,"expl":"Верно. ВЪЕЗД: приставка оканчивается на согласный, а корень начинается с Е/Ё/Ю/Я — пишем разделительный Ъ.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":256,"word":"НИЧЕЙ","claim":"в отрицательном местоимении под ударением пишется приставка НИ-.","ok":false,"expl":"В слове НИЧЕЙ приставка НИ- безударная, ударение падает на другой слог. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":257,"word":"КОЕ-ЧТО","claim":"местоимение пишется через дефис, потому что в нём есть приставка КОЕ- или суффикс -ТО, -ЛИБО, -НИБУДЬ.","ok":true,"expl":"Верно. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":258,"word":"ПРЕРВАТЬ (разговор)","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":true,"expl":"Верно. В слове ПРЕРВАТЬ (разговор) приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":259,"word":"СКОСИТЬ (траву)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"но в данном слове приставка состоит из одной буквы, и эта приставка неизменяемая.","rule":"з-с","src":"ФИПИ","dz":false},{"id":260,"word":"ПОЛДНЯ","claim":"слово пишется слитно, потому что после ПОЛ- стоит согласная буква (кроме Л).","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":261,"word":"ПО-СВОЕМУ","claim":"наречия с приставкой ПО- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: подолгу, понемногу пишутся слитно. Дефис нужен только при сочетании ПО- + -ОМУ/-ЕМУ/-И/-ЬИ, как в слове ПО-СВОЕМУ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":262,"word":"ПОДЫГРАТЬ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. ПОДЫГРАТЬ: русская приставка оканчивается на согласный, поэтому И в корне переходит в Ы. Исключения — приставки МЕЖ- и СВЕРХ- (сверхинтересный, межинститутский).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":263,"word":"ПРИВЯЗАТЬ (лодку)","claim":"написание приставки определяется её значением — приближение.","ok":false,"expl":"Значение указано неверно: здесь не «приближение». В слове ПРИВЯЗАТЬ (лодку) приставка ПРИ- имеет значение «присоединение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":264,"word":"ПРИКРЕПИТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":true,"expl":"Верно. В слове ПРИКРЕПИТЬ приставка ПРИ- имеет значение «присоединение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":265,"word":"СПРОСИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"Приставка С- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки З- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":266,"word":"БЕСХАРАКТЕРНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква приставки названа верно (С), но звук — нет: «х» обозначает глухой согласный, а не звонкий. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":267,"word":"ПРИОТКРЫТЬ (окно)","claim":"написание первой приставки определяется её значением — неполнота действия.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":true},{"id":268,"word":"ЧЕЙ-ТО","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"ЧЕЙ-ТО пишется через дефис. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":269,"word":"(хорошо) ОБДУМАТЬ","claim":"приставка ОБ- неизменяемая.","ok":true,"expl":"Верно. ОБ- — неизменяемая приставка. Неизменяемые приставки (С-, ОТ-, ПОД-, НАД-, ОБ-, В-, ПРЕД-, ПЕРЕ-, ДО-, ПО- и др.) пишутся всегда одинаково. Правило про глухой/звонкий работает только для приставок на -З/-С.","rule":"неизм","src":"Тренировка","dz":true},{"id":270,"word":"(заговорил) ПО-РУССКИ","claim":"наречие пишется через дефис, потому что оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":271,"word":"ВСКРИКНУТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка ВС- оканчивается на С, потому что дальше стоит буква «к», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":272,"word":"ПОДЫСКИВАТЬ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":273,"word":"РАССЫПА́ТЬ","claim":"в приставке без ударения пишется буква А.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":274,"word":"ПРИВСТАТЬ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"Значение указано неверно: здесь не «расположение вблизи». В слове ПРИВСТАТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":275,"word":"(взглянул) ИСКОСА","claim":"написание суффикса -А в наречии определяется наличием приставки ИС-.","ok":true,"expl":"Верно. Приставка определяет суффикс наречия: с приставками ИЗ-, ДО-, С- пишется суффикс -А (издавна, досуха, слева), с приставками В-, НА-, ЗА- — суффикс -О (вправо, начисто, засветло).","rule":"суффикс наречия","src":"ФИПИ","dz":false},{"id":276,"word":"ПЕДИНСТИТУТ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"ПЕДИНСТИТУТ — сложносокращённое слово, а не слово с приставкой. В сложносокращённых словах пишется И.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":277,"word":"ПРИЧУДА","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"ПРИЧУДА — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":278,"word":"ПРЕАМБУЛА","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"ПРЕАМБУЛА — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":279,"word":"ОБЫСКАТЬ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":280,"word":"ВСПАХАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Приставка оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":281,"word":"РАСЦАРАПАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «ц», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":true},{"id":282,"word":"БЕСКОНЕЧНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква приставки названа верно (С), но звук — нет: «к» обозначает глухой согласный, а не звонкий. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":283,"word":"ПОЛУТЬМА","claim":"слово пишется через дефис, потому что после ПОЛУ- стоит гласная буква.","ok":false,"expl":"ПОЛУ- всегда пишется слитно, никакого дефиса: ПОЛУТЬМА. Правило про гласную относится только к ПОЛ-.","rule":"пол","src":"Тренажёр","dz":false},{"id":284,"word":"БЕСЦЕЛЬНОЕ (существование)","claim":"на конце приставки перед звонким согласным пишется буква С.","ok":false,"expl":"На конце приставки пишется буква С, потому что после неё стоит буква Ц, обозначающая глухой (а не звонкий) согласный звук.","rule":"з-с","src":"ФИПИ","dz":false},{"id":285,"word":"(осталось) ПОЛЧАСА","claim":"слова с ПОЛ- всегда пишутся слитно.","ok":false,"expl":"Не всегда: пол-лимона, пол-яблока, пол-Москвы пишутся через дефис. Здесь слитно потому, что после ПОЛ- стоит согласная Ч (не Л).","rule":"пол","src":"Тренировка","dz":false},{"id":286,"word":"ПОЛ-ЛИМОНА","claim":"слово пишется через дефис, потому что после пол- стоит буква Л.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"ФИПИ","dz":false},{"id":287,"word":"НИ У КОГО","claim":"местоимение пишется раздельно, потому что между приставкой и местоимением стоит предлог.","ok":true,"expl":"Верно. НИ У КОГО: НЕ/НИ отделены предлогом, поэтому пишем в три слова. Без предлога было бы слитно: никого, некому.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":288,"word":"РАСЦАРАПАТЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Перед звонким согласным на конце приставки пишется З, а не С.","rule":"з-с","src":"ФИПИ","dz":true},{"id":289,"word":"БЕЗГРАНИЧНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «г», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":290,"word":"ВОСХИЩАТЬСЯ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный, пишется буква С.","ok":false,"expl":"Приставка «вос/воз» действительно меняет конечную букву в зависимости от глухости/звонкости последующего звука, однако звук «х» не звонкий, а глухой. Должно быть так: на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":291,"word":"ВОЗРАЗИТЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Звук определён верно (звонкий), но буква не та: перед звонкий согласным пишется З, а не С. В слове ВОЗРАЗИТЬ приставка оканчивается на З.","rule":"з-с","src":"Тренажёр","dz":false},{"id":292,"word":"(думает) ПО-ДРУГОМУ","claim":"наречия с приставкой ПО- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: подолгу, понемногу пишутся слитно. Дефис ставится только при сочетании приставки ПО- и суффикса -ОМУ/-ЕМУ/-И/-ЬИ, как здесь.","rule":"по-дефис","src":"Тренировка","dz":false},{"id":293,"word":"БЕСШУМНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «ш», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":294,"word":"БЕСЦЕННЫЙ","claim":"приставка неизменяемая, её написание не зависит от следующего звука.","ok":false,"expl":"Это изменяемая приставка на -З/-С. В слове БЕСЦЕННЫЙ пишется С, потому что дальше стоит буква «ц», обозначающая глухой согласный звук.","rule":"з-с","src":"Тренажёр","dz":false},{"id":295,"word":"КОЕ-КТО","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"КОЕ-КТО пишется через дефис. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":296,"word":"ПОДКИНУТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Д.","ok":false,"expl":"Приставка ПОД- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ПОТ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":297,"word":"ПОМАЛЕНЬКУ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО-.","ok":false,"expl":"ПОМАЛЕНЬКУ пишется слитно. Дефис ставится только тогда, когда есть и приставка ПО-, и суффикс -ОМУ/-ЕМУ/-И/-ЬИ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":298,"word":"ПРИМОРСКИЙ (город)","claim":"написание приставки определяется её значением — неполнота действия.","ok":false,"expl":"Значение указано неверно: здесь не «неполнота действия». В слове ПРИМОРСКИЙ (город) приставка ПРИ- имеет значение «расположение вблизи». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":299,"word":"ОБСТРИЧЬ","claim":"приставка ОБ- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. ОБ- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":300,"word":"НЕ С ЧЕМ","claim":"местоимение пишется раздельно, потому что между приставкой и местоимением стоит предлог.","ok":true,"expl":"Верно. НЕ С ЧЕМ: НЕ/НИ отделены предлогом, поэтому пишем в три слова. Без предлога было бы слитно: никого, некому.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":301,"word":"СДЕРЖАТЬ","claim":"приставка С- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. С- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":302,"word":"ПРИОЗЁРНЫЙ","claim":"правописание приставки определяется её значением — присоединение.","ok":false,"expl":"Приставка ПРИ- в данном слове обозначает пространственную близость (находящийся рядом с озером), а не присоединение.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":303,"word":"ВЬЮГА","claim":"разделительный Ъ пишется перед буквой, обозначающей два звука.","ok":false,"expl":"В слове ВЬЮГА приставки нет, поэтому пишется разделительный Ь, а не Ъ. Ъ бывает только после приставки на согласный (и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ-).","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":304,"word":"НИЧТО","claim":"в отрицательном местоимении под ударением пишется приставка НИ-.","ok":false,"expl":"В слове НИЧТО приставка НИ- безударная, ударение падает на другой слог. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":305,"word":"ПРИДВИНУТЬ","claim":"написание приставки определяется её значением — приближение.","ok":true,"expl":"Верно. В слове ПРИДВИНУТЬ приставка ПРИ- имеет значение «приближение». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":306,"word":"БЕЗЫНИЦИАТИВНЫЙ","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":307,"word":"ПОЛЧАСА","claim":"слово пишется через дефис, потому что начинается с ПОЛ-.","ok":false,"expl":"ПОЛЧАСА пишется слитно: после ПОЛ- стоит согласная (не Л), вторая часть — не имя собственное. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":308,"word":"РАСПИСА́ТЬ","claim":"в приставке без ударения пишется буква А.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":309,"word":"СТАЩИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С.","ok":false,"expl":"Правописание неизменяемой приставки С нужно запомнить.","rule":"з-с","src":"ФИПИ","dz":false},{"id":310,"word":"РО́СПИСЬ","claim":"в приставке под ударением пишется буква О.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":311,"word":"ПРЕОБРАЗОВАТЬ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":false,"expl":"Значение указано неверно: здесь не «высшая степень качества, близкое к слову «очень»». В слове ПРЕОБРАЗОВАТЬ приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":312,"word":"НЕЧЕГО (сказать)","claim":"в местоимении без ударения пишется приставка НЕ-.","ok":false,"expl":"Наоборот: в слове НЕЧЕГО (сказать) приставка НЕ- ударная. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":313,"word":"ДЕЗИНФОРМАЦИЯ","claim":"после приставки иноязычного происхождения, оканчивающейся на согласный, пишется буква И.","ok":true,"expl":"Верно. ДЕЗИНФОРМАЦИЯ: после иноязычных приставок (КОНТР-, СУБ-, ТРАНС-, ПАН-, СУПЕР-, ДЕЗ-, ДИС-) пишется И.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":314,"word":"ПРИТОРМОЗИТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Написание приставки «при» действительно определяется значением, но оно указано неверно, это неполнота действия.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":315,"word":"ПОЛ-ЛИТРА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":316,"word":"ПРИГЛУШИТЬ (свет)","claim":"написание приставки определяется её значением — совершение действия в чьих-либо интересах.","ok":false,"expl":"Значение указано неверно: здесь не «совершение действия в чьих-либо интересах». В слове ПРИГЛУШИТЬ (свет) приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":317,"word":"НЕСКОЛЬКО (групп)","claim":"неопределённые местоимения с приставкой НЕ- пишутся слитно, если между НЕ и словом нет предлога.","ok":true,"expl":"Верно. Под ударением в местоимении пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́). КОЕ-, -ТО, -ЛИБО, -НИБУДЬ дают дефис, но при предлоге КОЕ- пишется отдельно: кое у кого.","rule":"местоимения","src":"Тренировка","dz":false},{"id":318,"word":"ПЕРЕКРЁСТОК","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Е.","ok":false,"expl":"Приставка ПЕРЕ- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ПИРИ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":319,"word":"ПРИВЕТСТВОВАТЬ","claim":"написание приставки определяется её значением — приближение.","ok":false,"expl":"но в данном слове нет приставки, это часть корня.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":320,"word":"ПРЕЛЮДИЯ","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":false,"expl":"ПРЕЛЮДИЯ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":321,"word":"ОТБЕЖАТЬ","claim":"приставка ОТ- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. ОТ- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":322,"word":"ПРИСЕСТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":true,"expl":"Верно. В слове ПРИСЕСТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":323,"word":"ПРИБИТЬ (к стене)","claim":"приставка ПРИ- неизменяемая.","ok":false,"expl":"ПРИ- — не неизменяемая приставка: выбор между ПРЕ- и ПРИ- зависит от значения. Здесь значение присоединения (прибить = присоединить к стене).","rule":"неизм","src":"Тренировка","dz":true},{"id":324,"word":"ПРЕГРАДИТЬ (путь)","claim":"написание приставки определяется её значением — значение, близкое к значению приставки ПЕРЕ-.","ok":true,"expl":"Верно. В слове ПРЕГРАДИТЬ (путь) приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":325,"word":"СШИТЬ","claim":"приставка С- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. С- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":326,"word":"ВЗРЕВЕТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Буква приставки названа верно (З), но звук — нет: «р» обозначает звонкий согласный, а не глухой. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":327,"word":"ПРИЯТНЫЙ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"ПРИЯТНЫЙ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":328,"word":"ПОЛ-ОГУРЦА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":false,"expl":"После ПОЛ- в слове ПОЛ-ОГУРЦА стоит гласная, а не Л. Дефис здесь именно из-за гласной. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":329,"word":"КОЕ С КЕМ","claim":"местоимение пишется раздельно, потому что приставка КОЕ- отделена от него предлогом.","ok":true,"expl":"Верно. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":330,"word":"ОТЦЕПИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.","ok":false,"expl":"приставка ОТ всегда пишется одинаково","rule":"з-с","src":"ФИПИ","dz":false},{"id":331,"word":"БЕСШУМНЫЙ","clai
