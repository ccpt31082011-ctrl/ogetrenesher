<title>Приставки и молекулы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#141D18; --ink-soft:#5D6A63; --line:#E0E7E2;
  --accent:#1F5E45; --accent-soft:#E4EEE8;
  --ok:#1B7A52; --ok-bg:#E3F2E9; --ok-line:#95D0B2;
  --no:#B03A31; --no-bg:#FAE8E5; --no-line:#EBA79F;
  --shadow:0 1px 1px rgba(20,29,24,.04), 0 6px 20px rgba(20,29,24,.05);
  --ui:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --word:"PT Serif",Georgia,"Times New Roman",serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--ui);
  padding:0 0 env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:23px;line-height:1.2;margin:6px 0 2px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;max-width:42ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- главный экран ---------- */
.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease}
.tile:active{transform:scale(.985)}
.tile .t{font-size:18px;font-weight:600;letter-spacing:-.01em}
.tile .d{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.tile .n{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.stats{display:flex;gap:8px;margin:16px 0 4px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink-soft)}

/* ---------- список режимов ---------- */
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.mode:active{background:#EFF3F0}
.mode .mt{font-weight:500;font-size:15.5px}
.mode .mc{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}

/* ---------- тренажёр ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid var(--line);background:var(--card);border-radius:11px;width:36px;height:36px;
  font-size:17px;line-height:1;cursor:pointer;color:var(--ink-soft);flex:none}
.bar{flex:1;height:7px;background:#DFE7E2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}

.qcard{padding:20px 18px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;margin-bottom:12px}
.tag.dz{color:#8A5A12;background:#FBF0DC}
.word{font-family:var(--word);font-size:25px;font-weight:700;letter-spacing:-.005em;line-height:1.2;margin:0 0 9px}
.claim{font-size:16.5px;line-height:1.55;max-width:44ch}
.chemq{font-size:17px;line-height:1.5;font-weight:500;max-width:44ch}
.hint{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* ---------- кнопки ответа ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:16px 12px;
  font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;color:var(--ink);
  transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pick{border-color:var(--accent);background:var(--accent-soft)}
.btn.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.btn.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.btn[disabled]{cursor:default}
.opts .btn{width:100%;text-align:left;margin-bottom:9px;font-weight:500;font-size:16px;padding:14px 15px;display:block}
.numrow{display:flex;gap:9px}
.numrow input{flex:1;min-width:0;font:inherit;font-size:19px;font-weight:600;padding:14px 16px;border-radius:15px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.numrow input:focus{outline:none;border-color:var(--accent)}
.numrow input.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.numrow input.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.go{border:none;background:var(--accent);color:#fff;border-radius:15px;padding:14px 22px;font:inherit;
  font-size:16px;font-weight:600;cursor:pointer;flex:none}
.go:active{transform:scale(.97)}
.wide{width:100%;margin-top:12px}

/* ---------- разбор ---------- */
.fb{border-radius:var(--r);padding:15px 17px;margin-top:14px;border:1px solid;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--no-bg);border-color:var(--no-line)}
.fb .h{font-weight:700;font-size:15.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.fb.ok .h{color:var(--ok)} .fb.no .h{color:var(--no)}
.fb .b{font-size:15px;line-height:1.55}
.fb .right{margin-top:8px;font-size:15px}
.fb .right b{font-weight:700}

/* ---------- итоги ---------- */
.score{text-align:center;padding:26px 18px}
.score .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .pct{color:var(--ink-soft);margin-top:6px;font-size:14.5px}
.ghost{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;
  padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.mist{padding:14px 16px;margin-bottom:9px;font-size:14.5px;line-height:1.5}
.mist b{display:block;margin-bottom:3px}
.mist .m{color:var(--no);font-size:13.5px;margin-top:5px}
.hide{display:none!important}
.foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:22px;line-height:1.6}
</style>

<div class="wrap">
  <!-- ГЛАВНАЯ -->
  <div id="home">
    <h1>Приставки и молекулы</h1>
    <p class="sub">Два раздела к завтрашнему дню: приставки в задании 5 ОГЭ и повторение химии за 8 класс.</p>

    <button class="tile" data-go="rus">
      <div class="t">Русский язык</div>
      <div class="d">Правописание приставок. Верно или неверно объяснено написание слова.</div>
      <div class="n" id="nrus"></div>
    </button>

    <button class="tile" data-go="chem">
      <div class="t">Химия, 8 класс</div>
      <div class="d">Повторение: ОВР, степени окисления, классы веществ, строение атома, задачи.</div>
      <div class="n" id="nchem"></div>
    </button>

    <div class="stats">
      <div class="stat"><b id="s-all">0</b><span>решено всего</span></div>
      <div class="stat"><b id="s-pct">—</b><span>верных</span></div>
      <div class="stat"><b id="s-err">0</b><span>в ошибках</span></div>
    </div>
    <button class="ghost" id="resetBtn">Сбросить статистику</button>
    <div class="foot">Задания 5 взяты из открытого банка ФИПИ и дополнены по теории учителя.</div>
  </div>

  <!-- ВЫБОР РЕЖИМА -->
  <div id="modes" class="hide">
    <div class="top"><button class="back" data-back>‹</button><h2 id="mtitle" style="margin:0"></h2></div>
    <div id="mlist"></div>
  </div>

  <!-- ТРЕНАЖЁР -->
  <div id="quiz" class="hide">
    <div class="top">
      <button class="back" data-back>‹</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="count" id="cnt"></div>
    </div>
    <div class="card qcard" id="qbody"></div>
    <div id="answers"></div>
    <div id="fb"></div>
    <button class="go wide hide" id="next">Следующее задание</button>
  </div>

  <!-- ИТОГИ -->
  <div id="done" class="hide">
    <div class="card score">
      <div class="big" id="fscore"></div>
      <div class="pct" id="fpct"></div>
    </div>
    <button class="go wide" id="againErr">Работа над ошибками</button>
    <button class="ghost" id="again">Пройти ещё раз</button>
    <button class="ghost" id="toHome">На главную</button>
    <div id="mistakes" style="margin-top:20px"></div>
  </div>
</div>

<script>
/* ===== данные ===== */
const RUS = [{"id":1,"word":"РАЗЖЕЧЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «ж», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":2,"word":"(кофе) ПО-ВОСТОЧНОМУ","claim":"Наречия на -ОМУ с приставкой ПО- пишутся через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":true},{"id":3,"word":"БЕЗЫМЯННЫЙ","claim":"после приставки, оканчивающейся на согласный, в корне сохраняется буква И.","ok":false,"expl":"После русской приставки на согласный пишется Ы, а не И: БЕЗЫМЯННЫЙ. Букву И сохраняют только МЕЖ- и СВЕРХ-, иноязычные приставки (контр-, суб-, транс-, пан-, супер-, дез-), числительные ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и сложносокращённые слова.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":4,"word":"ПРИФРОНТОВОЙ (участок)","claim":"правописание приставки определяется её значением — близость.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренировка","dz":true},{"id":5,"word":"РАСЧЕРТИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «ч», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":6,"word":"ПОЛГОДА","claim":"слово пишется слитно, потому что после ПОЛ- стоит согласная буква (кроме Л).","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":7,"word":"ПОЛКОМНАТЫ","claim":"слово пишется через дефис, потому что начинается с ПОЛ-.","ok":false,"expl":"ПОЛКОМНАТЫ пишется слитно: после ПОЛ- стоит согласная (не Л), вторая часть — не имя собственное. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":8,"word":"ПРЕСЕЧЬ (спор)","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":false,"expl":"Значение указано неверно: здесь не «высшая степень качества, близкое к слову «очень»». В слове ПРЕСЕЧЬ (спор) приставка ПРЕ- имеет значение «значение, близкое к значению приставки ПЕРЕ-». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":9,"word":"БЕССМЕРТНЫЙ (подвиг)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «с», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":10,"word":"ПРИШКОЛЬНЫЙ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":11,"word":"ВПРАВО","claim":"написание суффикса -О в наречии определяется наличием приставки В-.","ok":true,"expl":"Верно. Приставка определяет суффикс наречия: с приставками ИЗ-, ДО-, С- пишется суффикс -А (издавна, досуха, слева), с приставками В-, НА-, ЗА- — суффикс -О (вправо, начисто, засветло).","rule":"суффикс наречия","src":"ФИПИ","dz":false},{"id":12,"word":"ПОЛ-ЕВРОПЫ","claim":"слово пишется через дефис, потому что вторая часть — имя собственное и пишется с прописной буквы.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":13,"word":"ПОЛ-ЯБЛОКА","claim":"слово пишется через дефис, потому что после пол- стоит гласная буква.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"ФИПИ","dz":false},{"id":14,"word":"НИСХОДЯЩАЯ (линия)","claim":"в слове приставка НИС-, которая пишется всегда одинаково независимо от произношения.","ok":false,"expl":"Приставка пишется с буквой С на конце, потому что корень начинается с глухого согласного (сравни: низвергнуть).","rule":"прочее","src":"ФИПИ","dz":false},{"id":15,"word":"ДЕЗОРГАНИЗАЦИЯ","claim":"пишется приставка ДИС- со значением отсутствия.","ok":false,"expl":"В слове ДЕЗОРГАНИЗАЦИЯ приставка ДЕЗ- (уничтожение, удаление, отсутствие). ДИС- — в словах дисбаланс, дисгармония.","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":16,"word":"НИКОГО","claim":"в отрицательном местоимении без ударения пишется приставка НИ-.","ok":true,"expl":"Верно. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":17,"word":"(дорог) ПО-ПРЕЖНЕМУ","claim":"наречие, образованное от основы имени прилагательного с помощью приставки ПО- и суффикса -ЕМУ-, пишется через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":18,"word":"НЕСКОЛЬКО","claim":"в неопределённом местоимении в безударной позиции пишется приставка НЕ-.","ok":false,"expl":"В данном слове приставка НЕ ударная, поэтому Е.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":19,"word":"ПОЛУКРУГ","claim":"слово с ПОЛУ- пишется слитно.","ok":true,"expl":"Верно. ПОЛУ- всегда пишется слитно: полумрак, полумера, полуфинал.","rule":"пол","src":"Тренажёр","dz":false},{"id":20,"word":"СБИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"В слове СБИТЬ приставка С- — неизменяемая, она состоит из одной буквы и пишется всегда одинаково. Приставки З- не существует. Правило про глухой/звонкий работает только для приставок на -З/-С.","rule":"з-с","src":"Тренировка","dz":true},{"id":21,"word":"ПОДДЕРЖАТЬ","claim":"на конце приставки перед звонким согласным пишется буква Д.","ok":false,"expl":"Приставка ПОД всегда пишется одинаково, она неизменяемая.","rule":"з-с","src":"ФИПИ","dz":false},{"id":22,"word":"НЕКТО","claim":"в местоимении под ударением пишется приставка НЕ-.","ok":true,"expl":"Верно. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":23,"word":"РАСЧЁТ","claim":"перед корнем -ЧЁТ- на конце приставки пишется одна буква С.","ok":true,"expl":"Верно. Запомните: раСчёт, раСчётливость — одна С перед корнем -чёт-; раССчитывать, раССчитать — две С перед корнем -чит-. Исключение: беССчётный.","rule":"расчёт","src":"Тренажёр","dz":false},{"id":24,"word":"СКРЫВАТЬСЯ (от погони)","claim":"на конце приставки перед глухим согласным пишется буква С.","ok":false,"expl":"Приставка С- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком (скрываться, сбить). Приставки З- не существует.","rule":"з-с","src":"Тренировка","dz":true},{"id":25,"word":"РАССОРИТЬСЯ","claim":"пишутся две буквы С, потому что три одинаковые согласные подряд в русском языке не пишутся.","ok":true,"expl":"Верно. РАС- + ССОРИТЬСЯ дало бы три С, поэтому пишем две: раССориться.","rule":"расчёт","src":"Тренажёр","dz":false},{"id":26,"word":"СФОТОГРАФИРОВАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":false,"expl":"В этом слове приставка С-, она неизменяемая и состоит всегда из одной буквы. Буква С на конце и одна С — это разные условия.","rule":"з-с","src":"ФИПИ","dz":true},{"id":27,"word":"ПРЕИНТЕРЕСНЫЙ","claim":"написание приставки определяется её значением — высшая степень качества, близкое к слову «очень».","ok":true,"expl":"Верно. В слове ПРЕИНТЕРЕСНЫЙ приставка ПРЕ- имеет значение «высшая степень качества, близкое к слову «очень»». У приставки ПРЕ- всего два значения: «очень» (высшая степень качества) и значение, близкое к ПЕРЕ-.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":28,"word":"НИКАКОЙ","claim":"в приставке отрицательного местоимения под ударением пишется буква И.","ok":false,"expl":"Правило испорчено: в приставке отрицательного местоимения БЕЗ ударения пишется буква «и», вот так верно.","rule":"местоимения","src":"ФИПИ","dz":false},{"id":29,"word":"ПРИБОЛЕТЬ","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Значение указано неверно: здесь не «присоединение». В слове ПРИБОЛЕТЬ приставка ПРИ- имеет значение «неполнота действия». Значения ПР ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":41,"word":"ЗДАНИЕ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":false,"expl":"В слове ЗДАНИЕ приставки нет вообще: З — часть корня. Запомните слова ЗДЕСЬ, ЗДАНИЕ, ЗДОРОВЬЕ, ЗДРАВСТВУЙ, НИ ЗГИ — приставки З- в русском языке не существует.","rule":"нет приставки","src":"Тренажёр","dz":false},{"id":42,"word":"БЕЗРАДОСТНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «р», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":43,"word":"ПРИРУЧИТЬ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"Значение указано неверно: здесь не «расположение вблизи». В слове ПРИРУЧИТЬ приставка ПРИ- имеет значение «доведение действия до конца». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":44,"word":"ПОДЫСКАТЬ (замену)","claim":"после русской приставки, оканчивающейся на согласный, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":45,"word":"ПОДТАЩИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Д.","ok":false,"expl":"Приставка ПОД- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ПОТ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":46,"word":"ВОЗБУДИТЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Звук определён верно (звонкий), но буква не та: перед звонкий согласным пишется З, а не С. В слове ВОЗБУДИТЬ приставка оканчивается на З.","rule":"з-с","src":"Тренажёр","dz":false},{"id":47,"word":"ПО-ДРУЖЕСКИ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО- и суффикса -ОМУ.","ok":false,"expl":"Суффикс назван неверно: в слове ПО-ДРУЖЕСКИ суффикс -И (-ЬИ), а не -ОМУ. Дефис при этом всё равно нужен.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":48,"word":"РОЗЫСКНО́Й","claim":"в приставке без ударения пишется буква А.","ok":false,"expl":"РОЗЫСКНОЙ — исключение: приставка безударная, но пишется О (от слова рО́зыск). В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":49,"word":"ПРЕГРАДИТЬ (путь)","claim":"написание приставки определяется её значением, близким к значению приставки ПЕРЕ-.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"Тренировка","dz":true},{"id":50,"word":"ПРИОТКРЫЛ (дверь)","claim":"приставка ПРИ- пишется в значении неполноты действия.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренировка","dz":true},{"id":51,"word":"СУБИНСПЕКТОР","claim":"после приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"СУБИНСПЕКТОР: приставка иноязычная, после неё пишется И, а не Ы. Ы пишется только после русских приставок на согласный.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":52,"word":"ПОДЫТОЖИТЬ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. ПОДЫТОЖИТЬ: русская приставка оканчивается на согласный, поэтому И в корне переходит в Ы. Исключения — приставки МЕЖ- и СВЕРХ- (сверхинтересный, межинститутский).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":53,"word":"БЕЗЗАКОННЫЙ","claim":"сочетание букв -зз- пишется на стыке приставки и корня.","ok":true,"expl":"Верно. Приставка оканчивается на З, и корень тоже начинается с З — на стыке получаются две буквы: беЗЗаботный, беЗЗаконный. Так же беССмысленный (БЕС- + СМЫСЛ).","rule":"прочее","src":"ФИПИ","dz":false},{"id":54,"word":"РАЗЕВАТЬ","claim":"на конце приставки перед звонким согласным пишется буква З.","ok":false,"expl":"Запомните: разевать, разинуть, разор, разорить пишутся с одной буквой З — это словарные слова.","rule":"расчёт","src":"Тренажёр","dz":false},{"id":55,"word":"ПО-ВОЛЧЬИ","claim":"наречие пишется через дефис, потому что образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. ПО-ВОЛЧЬИ: приставка ПО- + суффикс -И (-ЬИ) — пишем через дефис.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":56,"word":"ПРИДУМАТЬ","claim":"написание приставки определяется её значением — доведение действия до конца.","ok":true,"expl":"Верно. В слове ПРИДУМАТЬ приставка ПРИ- имеет значение «доведение действия до конца». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":57,"word":"(мне) БЕЗРАЗЛИЧНО","claim":"неизменяемая приставка БЕЗ-.","ok":false,"expl":"БЕЗ-/БЕС- — изменяемая приставка. З пишется потому, что дальше стоит буква Р, обозначающая звонкий согласный звук.","rule":"неизм","src":"Тренировка","dz":true},{"id":58,"word":"ОТДАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.","ok":false,"expl":"Приставка есть, но она является неизменяемой, всегда пишется одинаково.","rule":"з-с","src":"ФИПИ","dz":false},{"id":59,"word":"РАЗЖЕЧЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Верно. Приставка РАЗ- оканчивается на З, потому что дальше стоит буква «ж», обозначающая звонкий согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":60,"word":"ПРЕЗАБАВНЫЙ","claim":"правописание приставки определяется её значением, близким к слову очень.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":61,"word":"НИКАКОЙ","claim":"в отрицательном местоимении под ударением пишется приставка НИ-.","ok":false,"expl":"В слове НИКАКОЙ приставка НИ- безударная, ударение падает на другой слог. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":62,"word":"РАЗГОВОР","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Буква приставки названа верно (З), но звук — нет: «г» обозначает звонкий согласный, а не глухой. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":63,"word":"ВСПОМНИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка ВС- оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"Тренировка","dz":true},{"id":64,"word":"ПРЕДЪЯВИТЬ","claim":"разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквами Е, Ё, Ю, Я.","ok":true,"expl":"Верно. ПРЕДЪЯВИТЬ: приставка оканчивается на согласный, а корень начинается с Е/Ё/Ю/Я — пишем разделительный Ъ.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":65,"word":"БЕСПОЛЕЗНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «п», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"Тренировка","dz":true},{"id":66,"word":"ПРИВИЛЕГИЯ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"ПРИВИЛЕГИЯ — словарное слово. Значение приставки здесь затемнено или приставка срослась с корнем, поэтому по значению написание не определяется — слово нужно запомнить.","rule":"словарное","src":"Тренажёр","dz":false},{"id":67,"word":"ПОДЪЕЗД","claim":"перед буквами Е, Ё, Ю, Я после приставок на согласные пишется разделительный Ъ.","ok":true,"expl":"Верно. Разделительный Ъ пишется после приставки, оканчивающейся на согласный, и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","rule":"ъ-ь","src":"Тренировка","dz":false},{"id":68,"word":"КОЕ У КОГО","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"Причина названа неверно. Само по себе КОЕ- требует дефиса (кое-кто, кое-что). Раздельно, в три слова, пишем только потому, что между КОЕ- и местоимением стоит предлог У.","rule":"местоимения","src":"Тренировка","dz":true},{"id":69,"word":"БЕЗВРЕДНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Звук назван неверно: буква В обозначает звонкий согласный. Именно поэтому пишется З. Перед глухим была бы С (бесполезный, бесконечный).","rule":"з-с","src":"Тренировка","dz":false},{"id":70,"word":"(поступить) ПО СОВЕСТИ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО-.","ok":false,"expl":"(поступить) ПО СОВЕСТИ пишется раздельно. Дефис ставится только тогда, когда есть и приставка ПО-, и суффикс -ОМУ/-ЕМУ/-И/-ЬИ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":71,"word":"НИ С КЕМ","claim":"местоимение пишется раздельно, потому что между приставкой и местоимением стоит предлог.","ok":true,"expl":"Верно. НИ С КЕМ: НЕ/НИ отделены предлогом, поэтому пишем в три слова. Без предлога было бы слитно: никого, некому.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":72,"word":"ПО-ЛИСЬИ","claim":"наречие пишется через дефис, потому что образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. ПО-ЛИСЬИ: приставка ПО- + суффикс -И (-ЬИ) — пишем через дефис.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":73,"word":"БЕЗМОЛВНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Приставка оканчивается на З, потому что дальше стоит буква «м», обозначающая звонкий согласный звук. Приставки на -З/-С (БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-) меняют последнюю букву в зависимости от звонкости следующего звука.","rule":"з-с","src":"Тренажёр","dz":false},{"id":74,"word":"ПОЛ-ЛОЖКИ","claim":"слово пишется через дефис, так как после пол- следует буква Л.","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"ФИПИ","dz":false},{"id":75,"word":"ЗДРАВСТВУЙТЕ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":false,"expl":"В слове ЗДРАВСТВУЙТЕ приставки нет вообще: З — часть корня. Запомните слова ЗДЕСЬ, ЗДАНИЕ, ЗДОРОВЬЕ, ЗДРАВСТВУЙ, НИ ЗГИ — приставки З- в русском языке не существует.","rule":"нет приставки","src":"Тренажёр","dz":false},{"id":76,"word":"ПОДОЛГУ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО-.","ok":false,"expl":"ПОДОЛГУ пишется слитно. Дефис ставится только тогда, когда есть и приставка ПО-, и суффикс -ОМУ/-ЕМУ/-И/-ЬИ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":77,"word":"КОЕ У КОГО","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"Причина названа неверно: само по себе КОЕ- требует дефиса (кое-кто). Раздельно пишем только потому, что между КОЕ- и местоимением стоит предлог. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":78,"word":"СЪЁЖИТЬСЯ","claim":"буква разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквой Ё.","ok":true,"expl":"Верно. Разделительный Ъ пишется после приставки, оканчивающейся на согласный, и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","rule":"ъ-ь","src":"ФИПИ","dz":false},{"id":79,"word":"ПОДРИСОВАТЬ","claim":"на конце приставки перед звонким согласным пишется буква Д.","ok":false,"expl":"Приставка ПОД- неизменяемая, её написание не зависит от звонкости следующего звука (подрисовать, подписать). Приставки ПОТ- в русском языке не суще "dz":false},{"id":101,"word":"БЕЗЫНТЕРЕСНЫЙ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. БЕЗЫНТЕРЕСНЫЙ: русская приставка оканчивается на согласный, поэтому И в корне переходит в Ы. Исключения — приставки МЕЖ- и СВЕРХ- (сверхинтересный, межинститутский).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":102,"word":"БЕЗЫНИЦИАТИВНЫЙ","claim":"после русской приставки, оканчивающейся на согласную, пишется буква Ы.","ok":true,"expl":"Верно. После русской приставки на согласный И в корне переходит в Ы (безымянный, подытожить). Буква И остаётся после МЕЖ- и СВЕРХ-, после иноязычных приставок (контр-, суб-, транс-, пан-, супер-, дез-), после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и в сложносокращённых словах.","rule":"ы-и","src":"ФИПИ","dz":false},{"id":103,"word":"ПРИШКОЛЬНАЯ (территория)","claim":"правописание приставки определяется её значением — близость.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренировка","dz":true},{"id":104,"word":"ОБЫСКАТЬ","claim":"после приставки, оканчивающейся на согласный, в корне сохраняется буква И.","ok":false,"expl":"После русской приставки на согласный пишется Ы, а не И: ОБЫСКАТЬ. Букву И сохраняют только МЕЖ- и СВЕРХ-, иноязычные приставки (контр-, суб-, транс-, пан-, супер-, дез-), числительные ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- и сложносокращённые слова.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":105,"word":"ПОЛ-ЛОЖКИ","claim":"слова с ПОЛ- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: полчаса, полстакана пишутся слитно. В слове ПОЛ-ЛОЖКИ дефис — потому что после ПОЛ- стоит буква Л. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":106,"word":"СЪЁМКА","claim":"разделительный Ъ пишется после приставки перед любой гласной буквой.","ok":false,"expl":"Ъ пишется только перед Е, Ё, Ю, Я. Перед А, О, У, Ы, И, Э разделительный знак не нужен (сравните: подытожить, сэкономить). В слове СЪЁМКА Ъ стоит именно перед Е, Ё, Ю или Я.","rule":"ъ-ь","src":"Тренажёр","dz":false},{"id":107,"word":"ПРИУЧИТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":false,"expl":"Значение указано неверно: здесь не «неполнота действия». В слове ПРИУЧИТЬ приставка ПРИ- имеет значение «доведение действия до конца». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":108,"word":"ПО-РУССКИ","claim":"наречие пишется через дефис, потому что образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -И.","ok":true,"expl":"Верно. ПО-РУССКИ: приставка ПО- + суффикс -И (-ЬИ) — пишем через дефис.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":109,"word":"ПОЛ-ЛИСТА","claim":"слова с ПОЛ- всегда пишутся через дефис.","ok":false,"expl":"Не всегда: полчаса, полстакана пишутся слитно. В слове ПОЛ-ЛИСТА дефис — потому что после ПОЛ- стоит буква Л. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":110,"word":"ДИСГАРМОНИЯ","claim":"пишется приставка ДИС- со значением отсутствия, нарушения.","ok":true,"expl":"Верно. ДИС- = отсутствие/нарушение: дисгармония. ДЕЗ- пишется в словах дезинформация, дезорганизация — «уничтожение, удаление».","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":111,"word":"ВОЗГЛАВИТЬ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl
