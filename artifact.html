пра-про","src":"Тренажёр","dz":false},{"id":337,"word":"БЕССТРАШНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква приставки названа верно (С), но звук — нет: «с» обозначает глухой согласный, а не звонкий. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":338,"word":"ДВУХИГОЛЬНЫЙ","claim":"после числительных ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- пишется буква И.","ok":true,"expl":"Верно. ДВУХИГОЛЬНЫЙ: после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- буква И сохраняется.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":339,"word":"ПРИМОРСКИЙ","claim":"написание приставки определяется её значением — расположение вблизи.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":340,"word":"ОБТОЧИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Б.","ok":false,"expl":"Приставка ОБ- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ОП- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":341,"word":"ПОЛМЕТРА","claim":"слово пишется слитно, потому что после ПОЛ- стоит согласная буква (кроме Л).","ok":true,"expl":"Верно. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":342,"word":"ВЗИМАТЬ","claim":"после приставки, оканчивающейся на согласный, пишется буква Ы.","ok":false,"expl":"ВЗИМАТЬ — исключение: единственное слово, где после приставки на согласный пишется И. Его нужно запомнить.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":343,"word":"ПОЛ-ОКНА","claim":"слово пишется через дефис, потому что после ПОЛ- стоит буква Л.","ok":false,"expl":"После ПОЛ- в слове ПОЛ-ОКНА стоит гласная, а не Л. Дефис здесь именно из-за гласной. ПОЛ- пишется через дефис перед гласной, перед Л и перед прописной буквой; слитно — перед остальными согласными; раздельно — если между ПОЛ- и словом есть ещё одно слово. ПОЛУ- всегда слитно.","rule":"пол","src":"Тренажёр","dz":false},{"id":344,"word":"КОЕ К КОМУ","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"Причина названа неверно: само по себе КОЕ- требует дефиса (кое-кто). Раздельно пишем только потому, что между КОЕ- и местоимением стоит предлог. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":345,"word":"БЕСКОНЕЧНЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «к», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":346,"word":"ПРАБАБУШКА","claim":"пишется приставка ПРА-, она имеет значение «предшествующий, древний».","ok":true,"expl":"Верно. ПРА- = предшествующий: прабабушка. Не путайте с ПРО- (прообраз, прототип) — «служащий основой».","rule":"пра-про","src":"Тренажёр","dz":false},{"id":347,"word":"РАЗБУДИТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Буква приставки названа верно (З), но звук — нет: «б» обозначает звонкий согласный, а не глухой. Правило: перед звонким — З, перед глухим — С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":348,"word":"ВЦЕПИТЬСЯ","claim":"приставка В- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. В- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":349,"word":"ПО-ПРЕЖНЕМУ (интересно)","claim":"наречия на -ЕМУ с приставкой ПО- пишутся через дефис.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":true},{"id":350,"word":"ВЫШАГИВАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Ы.","ok":false,"expl":"Приставка ВЫ- неизменяемая — она пишется одинаково и перед глухим, и перед звонким звуком. Приставки ВИ- в русском языке не существует. Правило про глухой/звонкий относится только к приставкам на -З/-С.","rule":"неизм","src":"Тренажёр","dz":false},{"id":351,"word":"БЕЗЗАБОТНЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква З.","ok":true,"expl":"Верно. Приставка БЕЗ- оканчивается на З, потому что дальше стоит буква «з», обозначающая звонкий согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":352,"word":"БЕЗВЕТРЕННЫЙ","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Звук определён верно (звонкий), но буква не та: перед звонкий согласным пишется З, а не С. В слове БЕЗВЕТРЕННЫЙ приставка оканчивается на З.","rule":"з-с","src":"Тренажёр","dz":false},{"id":353,"word":"ЧЕТЫРЁХИГОЛЬНЫЙ","claim":"после числительных ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- пишется буква И.","ok":true,"expl":"Верно. ЧЕТЫРЁХИГОЛЬНЫЙ: после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- буква И сохраняется.","rule":"ы-и","src":"Тренажёр","dz":false},{"id":354,"word":"РО́ЗЫСК","claim":"в приставке под ударением пишется буква О.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":355,"word":"НЕКОТОРЫЙ","claim":"в местоимении без ударения пишется приставка НЕ-.","ok":false,"expl":"Наоборот: в слове НЕКОТОРЫЙ приставка НЕ- ударная. В отрицательных и неопределённых местоимениях под ударением пишется НЕ- (не́кто, не́чего), без ударения — НИ- (никто́, ничего́).","rule":"местоимения","src":"Тренажёр","dz":false},{"id":356,"word":"ПРЕРВАТЬ","claim":"написание приставки определяется её значением, близким к значению приставки пере-.","ok":true,"expl":"Верно, значение приставки определено правильно. У приставки ПРЕ- два значения: «очень» (высшая степень качества) и значение, близкое к приставке ПЕРЕ-.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":357,"word":"БЕСЧИСЛЕННЫЙ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка БЕС- оканчивается на С, потому что дальше стоит буква «ч», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":358,"word":"ПО-ОСЕННЕМУ","claim":"наречие пишется через дефис, потому что образовано от основы имени прилагательного (местоимения) при помощи приставки ПО- и суффикса -ОМУ/-ЕМУ.","ok":true,"expl":"Верно. ПО-ОСЕННЕМУ: приставка ПО- + суффикс -ОМУ/-ЕМУ — пишем через дефис.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":359,"word":"ПРЕГРАДА","claim":"выбор приставки определяется её значением, близким к значению слова очень.","ok":false,"expl":"— Написание букв е/и в приставке зависит от значения, но здесь оно близко к приставке «пере-».","rule":"пре-при","src":"ФИПИ","dz":false},{"id":360,"word":"ИСЧЕРПАТЬ (ресурсы)","claim":"на конце приставки перед буквой, обозначающей звонкий согласный звук, пишется буква С.","ok":false,"expl":"Буква Ч обозначает глухой согласный звук, а не звонкий. Именно поэтому на конце приставки ИС-, перед глухим согласным, пишется буква С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":361,"word":"ПРИДОМОВАЯ (территория)","claim":"написание приставки определяется её значением – присоединение.","ok":false,"expl":"Приставка ПРИ- в данном слове имеет значение «расположение вблизи, около чего-либо» (территория около дома), а не значение присоединения.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":362,"word":"ПРИЛЕТЕТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":false,"expl":"однако в данном случае оно указано неверно, правильно —«приближение, присоединение».","rule":"пре-при","src":"ФИПИ","dz":false},{"id":363,"word":"ВСКРУЖИТЬ (голову)","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка ВС- оканчивается на С, потому что дальше стоит буква «к», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":364,"word":"ПРИПОДНЯТЬ","claim":"написание приставки определяется её значением — неполнота действия.","ok":true,"expl":"Верно, значение приставки определено правильно. Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":365,"word":"ПРИОСТАНОВИТЬ (работу)","claim":"написание приставки определяется её значением — расположение вблизи.","ok":false,"expl":"Значение указано неверно. ПРИ- здесь обозначает неполноту действия (приостановить — остановить ненадолго, не полностью), а не расположение вблизи.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":366,"word":"РАССКАЗАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква З.","ok":false,"expl":"Звук определён верно (глухой), но буква не та: перед глухой согласным пишется С, а не З. В слове РАССКАЗАТЬ приставка оканчивается на С.","rule":"з-с","src":"Тренажёр","dz":false},{"id":367,"word":"ПРИПОДНЯТЬ (край)","claim":"написание приставки определяется её значением — совершение действия в чьих-либо интересах.","ok":false,"expl":"Значение указано неверно: здесь не «совершение действия в чьих-либо интересах». В слове ПРИПОДНЯТЬ (край) приставка ПРИ- имеет значение «неполнота действия». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":368,"word":"РО́ССЫПЬ","claim":"в приставке под ударением пишется буква О.","ok":true,"expl":"Верно. В приставке РАЗ-/РОЗ- (РАС-/РОС-) без ударения пишется А, под ударением — О: рассыпА́ть — рО́ссыпь. Исключение: розыскнО́й.","rule":"раз-роз","src":"Тренажёр","dz":false},{"id":369,"word":"ОТЫГРАТЬСЯ","claim":"после русской приставки, оканчивающейся на согласный, в корне пишется буква Ы.","ok":true,"expl":"Верно. ОТЫГРАТЬСЯ: русская приставка оканчивается на согласный, поэтому И в корне переходит в Ы. Исключения — приставки МЕЖ- и СВЕРХ- (сверхинтересный, межинститутский).","rule":"ы-и","src":"Тренажёр","dz":false},{"id":370,"word":"ВЗМАХНУТЬ","claim":"приставка неизменяемая, её написание не зависит от следующего звука.","ok":false,"expl":"Это изменяемая приставка на -З/-С. В слове ВЗМАХНУТЬ пишется З, потому что дальше стоит буква «м», обозначающая звонкий согласный звук.","rule":"з-с","src":"Тренажёр","dz":false},{"id":371,"word":"ПРЕДЪЯВИТЬ","claim":"буква разделительный Ъ пишется после приставки, оканчивающейся на согласный, перед буквой Я.","ok":true,"expl":"Верно. Разделительный Ъ пишется после приставки, оканчивающейся на согласный, и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","rule":"ъ-ь","src":"ФИПИ","dz":false},{"id":372,"word":"ДИСКВАЛИФИКАЦИЯ","claim":"пишется приставка ДИС- со значением отсутствия, нарушения.","ok":true,"expl":"Верно. ДИС- = отсутствие/нарушение: дисквалификация. ДЕЗ- пишется в словах дезинформация, дезорганизация — «уничтожение, удаление».","rule":"дис-дез","src":"Тренажёр","dz":false},{"id":373,"word":"ПРИПРЯТАТЬ","claim":"написание приставки определяется её значением — доведение действия до конца.","ok":false,"expl":"Значение указано неверно: здесь не «доведение действия до конца». В слове ПРИПРЯТАТЬ приставка ПРИ- имеет значение «совершение действия в чьих-либо интересах». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":374,"word":"ПОЗАВЧЕРА","claim":"приставка ПОЗА- неизменяемая, она пишется всегда одинаково.","ok":true,"expl":"Верно. ПОЗА- — неизменяемая приставка: её написание не зависит от того, звонкий или глухой звук идёт следом. Правило про З/С работает только для приставок БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС-.","rule":"неизм","src":"Тренажёр","dz":false},{"id":375,"word":"(верен) ПО-ПРЕЖНЕМУ","claim":"наречие пишется через дефис, потому что оно образовано от основы имени прилагательного при помощи приставки ПО- и суффикса -ЕМУ.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"ФИПИ","dz":false},{"id":376,"word":"ПОДСМОТРЕТЬ","claim":"приставка ПОД- неизменяемая.","ok":true,"expl":"Верно. ПОД- — неизменяемая приставка. Неизменяемые приставки (С-, ОТ-, ПОД-, НАД-, ОБ-, В-, ПРЕД-, ПЕРЕ-, ДО-, ПО- и др.) пишутся всегда одинаково. Правило про глухой/звонкий работает только для приставок на -З/-С.","rule":"неизм","src":"Тренировка","dz":true},{"id":377,"word":"КОЕ О ЧЁМ","claim":"неопределённое местоимение пишется раздельно, если в нём есть приставка КОЕ-.","ok":false,"expl":"Причина названа неверно: само по себе КОЕ- требует дефиса (кое-кто). Раздельно пишем только потому, что между КОЕ- и местоимением стоит предлог. Приставка КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ пишутся через дефис. Но если КОЕ- отделена от местоимения предлогом, всё пишется раздельно, в три слова: кое у кого, кое с кем.","rule":"местоимения","src":"Тренажёр","dz":false},{"id":378,"word":"ПРАОТЕЦ","claim":"пишется приставка ПРА-, она имеет значение «предшествующий, древний».","ok":true,"expl":"Верно. ПРА- = предшествующий: праотец. Не путайте с ПРО- (прообраз, прототип) — «служащий основой».","rule":"пра-про","src":"Тренажёр","dz":false},{"id":379,"word":"ПРЕМУДРЫЙ","claim":"выбор приставки определяется её значением, близким к значению слова очень.","ok":true,"expl":"Значение указано неверно: здесь ПРЕ- = «очень» (премудрый — очень мудрый), а не значение приставки ПЕРЕ-.","rule":"пре-при","src":"ФИПИ","dz":false},{"id":380,"word":"ПОНЕМНОГУ","claim":"наречие пишется через дефис, потому что образовано при помощи приставки ПО-.","ok":false,"expl":"ПОНЕМНОГУ пишется слитно. Дефис ставится только тогда, когда есть и приставка ПО-, и суффикс -ОМУ/-ЕМУ/-И/-ЬИ.","rule":"по-дефис","src":"Тренажёр","dz":false},{"id":381,"word":"РАСЦВЕТАТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. Приставка РАС- оканчивается на С, потому что дальше стоит буква «ц», обозначающая глухой согласный звук. Приставки на -З/-С — БЕЗ-/БЕС-, РАЗ-/РАС-, ИЗ-/ИС-, ВОЗ-/ВОС-, ВЗ-/ВС-, НИЗ-/НИС-, ЧЕРЕЗ-/ЧЕРЕС- — меняют последнюю букву: перед звонким согласным пишется З, перед глухим — С.","rule":"з-с","src":"ФИПИ","dz":false},{"id":382,"word":"ПРИГРАНИЧНЫЙ (район)","claim":"написание приставки определяется её значением — присоединение.","ok":false,"expl":"Значение указано неверно: здесь не «присоединение». В слове ПРИГРАНИЧНЫЙ (район) приставка ПРИ- имеет значение «расположение вблизи». Значения ПРИ-: присоединение, приближение, неполнота действия, расположение вблизи, доведение действия до конца, действие в чьих-либо интересах.","rule":"пре-при","src":"Тренажёр","dz":false},{"id":383,"word":"РАССТАВЛЯТЬ","claim":"на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.","ok":true,"expl":"Верно. После приставки стоит буква С, обозначающая глухой согласный звук, поэтому приставка оканчивается на С: РАС- + СТАВЛЯТЬ.","rule":"з-с","src":"Тренировка","dz":true},{"id":384,"word":"ОБЪЕЗДИЛ (всю страну)","claim":"после приставки, оканчивающейся на согласный, перед буквой Е пишется разделительный Ъ.","ok":true,"expl":"Верно. Разделительный Ъ пишется после приставки, оканчивающейся на согласный, и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед буквами Е, Ё, Ю, Я.","rule":"ъ-ь","src":"ФИПИ","dz":false},{"id":385,"word":"(рыба) ПО-ИСПАНСКИ","claim":"в наречии приставка ПО- пишется через дефис, потому что слово оканчивается на суффикс -И.","ok":true,"expl":"Верно. Наречие пишется через дефис, если в нём есть и приставка ПО-, и суффикс -ОМУ / -ЕМУ / -И / -ЬИ: по-новому, по-прежнему, по-русски, по-волчьи.","rule":"по-дефис","src":"Тренировка","dz":true},{"id":386,"word":"БЬЁТ","claim":"разделительный Ъ пишется перед буквой, обозначающей два звука.","ok":false,"expl":"В слове БЬЁТ приставки нет, поэтому пишется разделительный Ь, а не Ъ. Ъ бывает только после приставки на согласный (и после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ-).","rule":"ъ-ь","src":"Тренажёр","dz":false}];
const CHEM = [{"id":1,"type":"tf","topic":"ОВР","expl":"Верно. Окисление — отдача электронов, при этом степень окисления повышается.","q":"Окисление — это процесс отдачи электронов.","ok":true},{"id":2,"type":"tf","topic":"ОВР","expl":"Восстановление — это принятие электронов, степень окисления при этом понижается. Отдача электронов — окисление.","q":"Восстановление — это процесс отдачи электронов.","ok":false},{"id":3,"type":"tf","topic":"ОВР","expl":"Верно. Окислитель принимает электроны (сам восстанавливается), восстановитель отдаёт (сам окисляется).","q":"Окислитель в ходе реакции принимает электроны и понижает свою степень окисления.","ok":true},{"id":4,"type":"tf","topic":"ОВР","expl":"Верно. Отдал электроны → окислился → степень окисления выросла.","q":"Восстановитель в ходе реакции отдаёт электроны, его степень окисления повышается.","ok":true},{"id":5,"type":"tf","topic":"ОВР","expl":"Железо — восстановитель: Fe⁰ − 2ē → Fe⁺². Окислитель здесь водород H⁺¹, он принимает электроны: 2H⁺¹ + 2ē → H₂⁰.","q":"В реакции Fe + H₂SO₄ = FeSO₄ + H₂ железо является окислителем.","ok":false},{"id":6,"type":"tf","topic":"ОВР","expl":"Верно. 2H⁺¹ + 2ē → H₂⁰ — водород восстанавливается, значит он окислитель. Железо Fe⁰ − 2ē → Fe⁺² окисляется, оно восстановитель.","q":"В реакции Fe + H₂SO₄ = FeSO₄ + H₂ окислителем является водород в степени окисления +1.","ok":true},{"id":7,"type":"tf","topic":"ОВР","expl":"Сера и до, и после реакции имеет степень окисления +6 (в H₂SO₄ и в FeSO₄). Меняются только Fe и H.","q":"В реакции Fe + H₂SO₄ = FeSO₄ + H₂ сера меняет свою степень окисления.","ok":false},{"id":8,"type":"tf","topic":"ОВР","expl":"Не всегда. Например, CaO + H₂O = Ca(OH)₂ — реакция соединения, но степени окисления не меняются.","q":"Реакции соединения всегда являются окислительно-восстановительными.","ok":false},{"id":9,"type":"tf","topic":"ОВР","expl":"Верно. В реакциях обмена вещества меняются составными частями, степени окисления не изменяются.","q":"Реакции обмена никогда не бывают окислительно-восстановительными.","ok":true},{"id":10,"type":"tf","topic":"ОВР","expl":"Верно: H₂⁰, O₂⁰, Fe⁰, Cl₂⁰ — в простом веществе степень окисления всегда 0.","q":"Степень окисления атома в простом веществе равна нулю.","ok":true},{"id":11,"type":"tf","topic":"ОВР","expl":"Верно. У металла степень окисления 0 — понижать её некуда, он способен только отдавать электроны.","q":"Свободный металл в реакции может быть только восстановителем.","ok":true},{"id":12,"type":"tf","topic":"ОВР","expl":"Фтор — самый сильный окислитель, в соединениях у него всегда степень окисления −1. Восстановителем он быть не может.","q":"Фтор в соединениях может быть и окислителем, и восстановителем.","ok":false},{"id":13,"type":"tf","topic":"ОВР","expl":"Верно. На этом и построен метод электронного баланса.","q":"Число электронов, отданных восстановителем, равно числу электронов, принятых окислителем.","ok":true},{"id":14,"type":"tf","topic":"ОВР","expl":"Не всегда: CaCO₃ = CaO + CO₂ — разложение без изменения степеней окисления.","q":"Реакции разложения всегда являются окислительно-восстановительными.","ok":false},{"id":15,"type":"one","topic":"ОВР","expl":"Кислород принимает электроны: O₂⁰ + 4ē → 2O⁻². Значит, он окислитель. Магний отдаёт — он восстановитель.","q":"В реакции 2Mg + O₂ = 2MgO окислителем является:","opts":["магний Mg⁰","кислород O₂⁰","оксид магния MgO","окислителя нет"],"ans":[1]},{"id":16,"type":"one","topic":"ОВР","expl":"Zn⁰ − 2ē → Zn⁺²: цинк отдаёт электроны, значит он восстановитель. Окислитель — водород H⁺¹.","q":"В реакции Zn + 2HCl = ZnCl₂ + H₂ восстановителем является:","opts":["цинк Zn⁰","водород H⁺¹","хлор Cl⁻¹","соляная кислота целиком"],"ans":[0]},{"id":17,"type":"one","topic":"ОВР","expl":"Восстановление — принятие электронов. Отдача — окисление. Мнемоника: «восстановитель отдаёт, окислитель принимает».","q":"Какой процесс называется восстановлением?","opts":["отдача электронов","принятие электронов","выделение теплоты","растворение вещества"],"ans":[1]},{"id":18,"type":"one","topic":"ОВР","expl":"Cu⁺² + 2ē → Cu⁰ — медь принимает электроны, то есть восстанавливается. Окислитель — CuO, восстановитель — водород.","q":"В реакции CuO + H₂ = Cu + H₂O медь:","opts":["окисляется","восстанавливается","не меняет степень окисления","является восстановителем"],"ans":[1]},{"id":19,"type":"num","topic":"ОВР","expl":"Степень окисления выросла с 0 до +2, значит атом отдал 2 электрона: Fe⁰ − 2ē → Fe⁺².","q":"Сколько электронов отдаёт атом железа в процессе Fe⁰ → Fe⁺²?","ans":"2","unit":"ē"},{"id":20,"type":"num","topic":"ОВР","expl":"Степень окисления понизилась с 0 до −2, значит атом принял 2 электрона: S⁰ + 2ē → S⁻².","q":"Сколько электронов принимает атом серы в процессе S⁰ → S⁻²?","ans":"2","unit":"ē"},{"id":21,"type":"num","topic":"ОВР","expl":"От 0 до +3 — атом отдал 3 электрона: Al⁰ − 3ē → Al⁺³.","q":"Сколько электронов отдаёт атом алюминия в процессе Al⁰ → Al⁺³?","ans":"3","unit":"ē"},{"id":22,"type":"num","topic":"ОВР","expl":"Каждый из двух атомов принимает по 2 электрона, всего 4: O₂⁰ + 4ē → 2O⁻².","q":"Сколько электронов принимает молекула кислорода в процессе O₂⁰ → 2O⁻²?","ans":"4","unit":"ē"},{"id":23,"type":"two","topic":"ОВР","expl":"Окислитель принимает электроны и сам при этом восстанавливается — его степень окисления понижается.","q":"Выберите два утверждения об окислителе, которые верны:","opts":["принимает электроны","отдаёт электроны","в ходе реакции восстанавливается","в ходе реакции окисляется","его степень окисления повышается"],"ans":[0,2]},{"id":24,"type":"two","topic":"ОВР","expl":"Окисление — повышение степени окисления. Fe⁰ → Fe⁺³ и Cu⁰ → Cu⁺² — рост. Остальные — понижение, то есть восстановление.","q":"Выберите два процесса, которые являются окислением:","opts":["Fe⁰ → Fe⁺³","S⁺⁶ → S⁺⁴","Cl₂⁰ → 2Cl⁻¹","Cu⁰ → Cu⁺²","N⁺⁵ → N⁺²"],"ans":[0,3]},{"id":25,"type":"two","topic":"ОВР","expl":"H₂SO₄ и SO₃: сера +6. В H₂S сера −2, в SO₂ и Na₂SO₃ — +4.","q":"Выберите два вещества, в которых сера проявляет степень окисления +6:","opts":["H₂S","SO₂","H₂SO₄","SO₃","Na₂SO₃"],"ans":[2,3]},{"id":26,"type":"tf","topic":"Типы реакций","expl":"Это реакция разложения: из одного вещества образуется несколько. Реакция соединения — это когда из нескольких веществ образуется одно.","q":"CaCO₃ = CaO + CO₂ — реакция соединения.","ok":false},{"id":27,"type":"tf","topic":"Типы реакций","expl":"Верно: из нескольких веществ образуется одно.","q":"2H₂ + O₂ = 2H₂O — реакция соединения.","ok":true},{"id":28,"type":"tf","topic":"Типы реакций","expl":"Это реакция замещения: атомы простого вещества замещают атомы в сложном. Реакция соединения — это когда из нескольких веществ образуется одно.","q":"Fe + CuSO₄ = FeSO₄ + Cu — реакция соединения.","ok":false},{"id":29,"type":"tf","topic":"Типы реакций","expl":"Это реакция обмена: два сложных вещества обмениваются составными частями. Реакция соединения — это когда из нескольких веществ образуется одно.","q":"NaOH + HCl = NaCl + H₂O — реакция соединения.","ok":false},{"id":30,"type":"tf","topic":"Типы реакций","expl":"Верно: атомы простого вещества замещают атомы в сложном.","q":"Zn + 2HCl = ZnCl₂ + H₂ — реакция замещения.","ok":true},{"id":31,"type":"tf","topic":"Типы реакций","expl":"Верно: из нескольких веществ образуется одно.","q":"CaO + H₂O = Ca(OH)₂ — реакция соединения.","ok":true},{"id":32,"type":"tf","topic":"Типы реакций","expl":"Это реакция разложения: из одного вещества образуется несколько. Реакция обмена — это когда два сложных вещества обмениваются составными частями.","q":"2KClO₃ = 2KCl + 3O₂ — реакция обмена.","ok":false},{"id":33,"type":"tf","topic":"Типы реакций","expl":"Это реакция обмена: два сложных вещества обмениваются составными частями. Реакция соединения — это когда из нескольких веществ образуется одно.","q":"AgNO₃ + NaCl = AgCl↓ + NaNO₃ — реакция соединения.","ok":false},{"id":34,"type":"tf","topic":"Типы реакций","expl":"Это реакция разложения: из одного вещества образуется несколько. Реакция обмена — это когда два сложных вещества обмениваются составными частями.","q":"Cu(OH)₂ = CuO + H₂O — реакция обмена.","ok":false},{"id":35,"type":"tf","topic":"Типы реакций","expl":"Верно: из нескольких веществ образуется одно.","q":"N₂ + 3H₂ = 2NH₃ — реакция соединения.","ok":true},{"id":36,"type":"tf","topic":"Типы реакций","expl":"Верно: два сложных вещества обмениваются составными частями.","q":"BaCl₂ + H₂SO₄ = BaSO₄↓ + 2HCl — реакция обмена.","ok":true},{"id":37,"type":"tf","topic":"Типы реакций","expl":"Это реакция замещения: атомы простого вещества замещают атомы в сложном. Реакция обмена — это когда два сложных вещества обмениваются составными частями.","q":"2Al + 3CuCl₂ = 2AlCl₃ + 3Cu — реакция обмена.","ok":false},{"id":38,"type":"one","topic":"Типы реакций","expl":"Простое вещество (Zn) замещает водород в сложном веществе (HCl) — это реакция замещения.","q":"К какому типу относится реакция Zn + 2HCl = ZnCl₂ + H₂?","opts":["соединения","разложения","замещения","обмена"],"ans":[2]},{"id":39,"type":"one","topic":"Типы реакций","expl":"Два сложных вещества обменялись составными частями — реакция обмена. Признак протекания — выпал осадок Cu(OH)₂.","q":"К какому типу относится реакция CuSO₄ + 2NaOH = Cu(OH)₂↓ + Na₂SO₄?","opts":["соединения","разложения","замещения","обмена"],"ans":[3]},{"id":40,"type":"one","topic":"Типы реакций","expl":"Из нескольких — одно: реакция соединения (например, CaO + H₂O = Ca(OH)₂).","q":"Реакция, при которой из нескольких веществ образуется одно, называется реакцией:","opts":["разложения","соединения","замещения","обмена"],"ans":[1]},{"id":41,"type":"two","topic":"Типы реакций","expl":"Признаки химической реакции: осадок, газ, изменение цвета, запах, выделение или поглощение теплоты и света. Измельчение, плавление, испарение — физические явления.","q":"Выберите два признака протекания химической реакции:","opts":["выпадение осадка","измельчение вещества","выделение газа","плавление вещества","испарение жидкости"],"ans":[0,2]},{"id":42,"type":"two","topic":"Типы реакций","expl":"В реакциях разложения из одного вещества получается несколько.","q":"Выберите две реакции разложения:","opts":["2Fe(OH)₃ = Fe₂O₃ + 3H₂O","S + O₂ = SO₂","2HgO = 2Hg + O₂","Mg + 2HCl = MgCl₂ + H₂","CaO + CO₂ = CaCO₃"],"ans":[0,2]},{"id":43,"type":"tf","topic":"Типы реакций","expl":"Верно. Кислота + основание = соль + вода — обмен составными частями.","q":"Реакция нейтрализации — это частный случай реакции обмена.","ok":true},{"id":44,"type":"tf","topic":"Типы реакций","expl":"Верно: в одной из нескольких веществ получается одно, в другой — наоборот.","q":"Реакции соединения и разложения противоположны друг другу.","ok":true},{"id":45,"type":"num","topic":"Степень окисления","expl":"В H₂SO₄ степень окисления серы равна +6. Опорные значения: у водорода +1, у кислорода −2, у металлов I группы +1, II группы +2, у алюминия +3. Сумма степеней окисления в соединении равна нулю.","q":"Определите степень окисления серы в соединении H₂SO₄. Знак укажите: например, +6 или −2.","ans":"+6","unit":""},{"id":46,"type":"num","topic":"Степень окисления","expl":"В H₂SO₃ степень окисления серы равна +4. Опорные значения: у водорода +1, у кислорода −2, у металлов I группы +1, II группы +2, у алюминия +3. Сумма степеней окисления в соединении равна нулю.","q":"Определите степень окисления серы в соединении H₂SO₃. Знак укажите: например, +6 или −2.","ans":"+4","unit":""},{"id":47,"type":"num","topic":"Степень окисления","expl":"В H₂S степень окисления серы равна −2. Опорные значения: у водорода +1, у кислорода −2, у металлов I группы +1, II группы +2, у алюминия +3. Сумма степеней окисления в соединении равна нулю.","q":"Определите степень окисления серы в соединении H₂S. Знак укажите: например, +6 или −2.","ans":"−2","unit":""},{"id":48,"type":"num","topic":"Степень окисления","expl":"В SO₂ степень окисления серы равна +4. Опорные значения: у водорода +1, у кислорода −2, у металлов I группы +1, II группы +2, у алюминия +3. Сумма степеней окисления в соединении равн ":"Классы веществ","expl":"Медь стоит в ряду активности после водорода, поэтому из кислот его не вытесняет.","q":"Медь вытесняет водород из соляной кислоты.","ok":false},{"id":173,"type":"tf","topic":"Классы веществ","expl":"Верно: Zn + 2HCl = ZnCl₂ + H₂↑. Металлы после водорода (Cu, Ag, Au) — не вытесняют.","q":"Металлы, стоящие в ряду активности до водорода, вытесняют его из растворов кислот.","ok":true},{"id":174,"type":"one","topic":"Классы веществ","expl":"Кислота + основание = соль + вода. Например, NaOH + HCl = NaCl + H₂O.","q":"Реакция нейтрализации — это взаимодействие:","opts":["кислоты и основания","двух оксидов","металла и кислоты","соли и воды"],"ans":[0]},{"id":175,"type":"one","topic":"Классы веществ","expl":"В кислой соли сохраняется атом водорода кислоты: NaHSO₄, NaHCO₃, Ca(HCO₃)₂.","q":"Какое вещество относится к кислым солям?","opts":["Na₂SO₄","NaHSO₄","NaOH","SO₃"],"ans":[1]},{"id":176,"type":"two","topic":"Классы веществ","expl":"Основания — это металл + гидроксогруппа OH. KOH и Ca(OH)₂. HNO₃ — кислота, CaO — оксид, Na₂SO₄ — соль.","q":"Выберите два вещества, которые относятся к основаниям:","opts":["KOH","HNO₃","Ca(OH)₂","CaO","Na₂SO₄"],"ans":[0,2]},{"id":177,"type":"two","topic":"Классы веществ","expl":"Кислотные оксиды образуют неметаллы: SO₂ и N₂O₅. Остальные — основные оксиды металлов.","q":"Выберите два кислотных оксида:","opts":["CaO","SO₂","Na₂O","N₂O₅","MgO"],"ans":[1,3]},{"id":178,"type":"tf","topic":"Строение атома","expl":"Верно. Порядковый номер = число протонов = заряд ядра = число электронов в нейтральном атоме.","q":"Число протонов в атоме равно порядковому номеру элемента.","ok":true},{"id":179,"type":"tf","topic":"Строение атома","expl":"Верно. Например, у ³⁵Cl: N = 35 − 17 = 18.","q":"Число нейтронов равно разности массового числа и порядкового номера: N = A − Z.","ok":true},{"id":180,"type":"tf","topic":"Строение атома","expl":"Верно. Элементы 3-го периода имеют три электронных слоя.","q":"Номер периода показывает число электронных слоёв в атоме.","ok":true},{"id":181,"type":"tf","topic":"Строение атома","expl":"Верно. У серы (VI группа) на внешнем слое 6 электронов.","q":"Номер группы (главной подгруппы) показывает число электронов на внешнем слое.","ok":true},{"id":182,"type":"tf","topic":"Строение атома","expl":"Наоборот, уменьшается: заряд ядра растёт, а число слоёв то же, электроны притягиваются сильнее.","q":"В периоде слева направо радиус атома увеличивается.","ok":false},{"id":183,"type":"tf","topic":"Строение атома","expl":"Верно. Растёт число слоёв, внешние электроны легче отрываются.","q":"В группе сверху вниз металлические свойства усиливаются.","ok":true},{"id":184,"type":"tf","topic":"Строение атома","expl":"Верно, а металлические ослабевают. Самый сильный неметалл — фтор.","q":"В периоде слева направо неметаллические свойства усиливаются.","ok":true},{"id":185,"type":"tf","topic":"Строение атома","expl":"У изотопов одинаковое число протонов, но разное число нейтронов (и потому разные массовые числа).","q":"Изотопы — это атомы одного элемента с разным числом протонов.","ok":false},{"id":186,"type":"tf","topic":"Строение атома","expl":"Верно. Число протонов равно числу электронов, заряды компенсируются.","q":"Атом в целом электронейтрален.","ok":true},{"id":187,"type":"tf","topic":"Строение атома","expl":"Электрон заряжен отрицательно (−1), положителен протон (+1).","q":"Электрон имеет положительный заряд.","ok":false},{"id":188,"type":"num","topic":"Строение атома","expl":"N = A − Z = 35 − 17 = 18 нейтронов.","q":"Сколько нейтронов содержится в атоме ³⁵Cl (порядковый номер 17)?","ans":"18","unit":""},{"id":189,"type":"num","topic":"Строение атома","expl":"Порядковый номер железа 26, значит и протонов 26.","q":"Сколько протонов в атоме железа Fe?","ans":"26","unit":""},{"id":190,"type":"num","topic":"Строение атома","expl":"Сера в VI группе главной подгруппы — на внешнем слое 6 электронов.","q":"Сколько электронов на внешнем энергетическом уровне атома серы?","ans":"6","unit":""},{"id":191,"type":"num","topic":"Строение атома","expl":"Натрий в 3-м периоде, значит электронных слоёв три.","q":"Сколько электронных слоёв в атоме натрия?","ans":"3","unit":""},{"id":192,"type":"num","topic":"Строение атома","expl":"N = 40 − 20 = 20.","q":"Сколько нейтронов в атоме ⁴⁰Ca (порядковый номер 20)?","ans":"20","unit":""},{"id":193,"type":"num","topic":"Строение атома","expl":"Порядковый номер алюминия 13 — столько же протонов и электронов.","q":"Сколько электронов в нейтральном атоме алюминия?","ans":"13","unit":""},{"id":194,"type":"one","topic":"Строение атома","expl":"Все четыре — элементы 3-го периода. В периоде слева направо металлические свойства ослабевают, значит сильнее всего они у натрия.","q":"Наиболее ярко выраженные металлические свойства проявляет:","opts":["Na","Mg","Al","Si"],"ans":[0]},{"id":195,"type":"one","topic":"Строение атома","expl":"2 электрона снаружи — II группа; 4 слоя — 4-й период. Это кальций.","q":"Атомы какого элемента имеют 2 электрона на внешнем слое и 4 электронных слоя?","opts":["Mg","Ca","Be","K"],"ans":[1]},{"id":196,"type":"two","topic":"Строение атома","expl":"Период — число слоёв, номер группы (главная подгруппа) — число внешних электронов. Порядковый номер равен числу протонов, а не нейтронов.","q":"Выберите два утверждения, которые верны для периодической системы:","opts":["номер периода равен числу электронных слоёв","номер группы равен числу нейтронов","номер группы главной подгруппы равен числу внешних электронов","порядковый номер равен числу нейтронов","в группе сверху вниз неметаллические свойства усиливаются"],"ans":[0,2]},{"id":197,"type":"tf","topic":"Химическая связь","expl":"Верно. Между одинаковыми неметаллами — ковалентная неполярная, между разными неметаллами — ковалентная полярная, между металлом и неметаллом — ионная, в металлах — металлическая.","q":"В веществе O₂ химическая связь ковалентная неполярная.","ok":true},{"id":198,"type":"tf","topic":"Химическая связь","expl":"Верно. Между оди Химическая связь","expl":"Верно. Отсюда электропроводность, теплопроводность, пластичность и блеск металлов.","q":"Металлическая связь образуется за счёт общих электронов, свободно движущихся по кристаллу.","ok":true},{"id":213,"type":"tf","topic":"Химическая связь","expl":"Между одинаковыми атомами неметалла связь ковалентная НЕполярная (O₂, N₂). Полярная — между разными неметаллами (HCl, H₂O).","q":"Ковалентная полярная связь образуется между атомами одного и того же неметалла.","ok":false},{"id":214,"type":"one","topic":"Химическая связь","expl":"NaCl образован ионами Na⁺ и Cl⁻, решётка ионная — отсюда высокая температура плавления и хрупкость.","q":"Какой тип кристаллической решётки у поваренной соли NaCl?","opts":["молекулярная","ионная","атомная","металлическая"],"ans":[1]},{"id":215,"type":"one","topic":"Химическая связь","expl":"Алмаз: атомы углерода связаны прочными ковалентными связями по всему кристаллу.","q":"Какое вещество имеет атомную кристаллическую решётку?","opts":["лёд","алмаз","поваренная соль","медь"],"ans":[1]},{"id":216,"type":"two","topic":"Химическая связь","expl":"Ковалентная неполярная связь — между одинаковыми атомами неметалла: N₂ и Cl₂.","q":"Выберите два вещества с ковалентной неполярной связью:","opts":["N₂","HCl","Cl₂","NaCl","H₂O"],"ans":[0,2]},{"id":217,"type":"two","topic":"Химическая связь","expl":"Свободные электроны дают металлам электропроводность, теплопроводность, пластичность и блеск.","q":"Выберите два свойства веществ с металлической связью:","opts":["электропроводность","летучесть","пластичность","хрупкость","нерастворимость в любых средах"],"ans":[0,2]},{"id":218,"type":"num","topic":"Задачи","expl":"m = M · n = 18 · 3 = 54 г.","q":"Вычислите массу 3 моль вещества H₂O. M(H₂O) = 18 г/моль.","ans":"54","unit":"г"},{"id":219,"type":"num","topic":"Задачи","expl":"m = M · n = 44 · 0,5 = 22 г.","q":"Вычислите массу 0,5 моль вещества CO₂. M(CO₂) = 44 г/моль.","ans":"22","unit":"г"},{"id":220,"type":"num","topic":"Задачи","expl /* ===== Telegram ===== */
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); if (TG.setHeaderColor) TG.setHeaderColor('#FBF9F6'); } catch(e){} }
function buzz(kind){ try{ TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(kind); }catch(e){} }

/* ===== состояние ===== */
const $ = s => document.querySelector(s);
const KEY = 'oge-trainer-v1';
let ST = { done:0, right:0, errors:[] };
try { ST = Object.assign(ST, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

let deck = [], pos = 0, score = 0, wrong = [], subject = 'rus', answered = false, picked = [];

function show(id){
  ['home','modes','quiz','done'].forEach(x => $('#'+x).classList.toggle('hide', x !== id));
  window.scrollTo(0,0);
  if (TG && TG.BackButton) { id === 'home' ? TG.BackButton.hide() : TG.BackButton.show(); }
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function plural(n, a, b, c){ const m=n%100, k=n%10; return n+' '+(m>=11&&m<=14 ? c : k===1 ? a : k>=2&&k<=4 ? b : c); }

function refreshHome(){
  $('#nrus').textContent = RUS.length + ' заданий';
  $('#nchem').textContent = CHEM.length + ' вопросов';
  $('#s-all').textContent = ST.done;
  $('#s-pct').textContent = ST.done ? Math.round(ST.right/ST.done*100) + '%' : '—';
  $('#s-err').textContent = ST.errors.length;
}

/* ===== режимы ===== */
function openModes(sub){
  subject = sub;
  $('#mtitle').textContent = sub === 'rus' ? 'Русский язык' : 'Химия, 8 класс';
  const list = [];
  const errs = ST.errors.filter(e => e.s === sub);
  if (errs.length) list.push({ t:'Работа над ошибками', c:errs.length, pick:() => errPool(sub) });

  if (sub === 'rus'){
    list.push({ t:'Все задания вперемешку', c:RUS.length, pick:() => RUS });
    list.push({ t:'Домашнее задание учителя', c:RUS.filter(x=>x.dz).length, pick:() => RUS.filter(x=>x.dz) });
    list.push({ t:'Только открытый банк ФИПИ', c:RUS.filter(x=>x.src==='ФИПИ').length, pick:() => RUS.filter(x=>x.src==='ФИПИ') });
    list.push({ t:'Быстрый прогон — 20 заданий', c:20, pick:() => shuffle(RUS).slice(0,20) });
    const rules = {};
    RUS.forEach(x => rules[x.rule] = (rules[x.rule]||0)+1);
    const NAME = {'з-с':'Приставки на З / С','пре-при':'ПРЕ- и ПРИ-','пол':'ПОЛ- и ПОЛУ-','по-дефис':'Наречия с ПО- через дефис',
      'ы-и':'Ы и И после приставок','местоимения':'Местоимения: НЕ, НИ, КОЕ-','неизм':'Неизменяемые приставки',
      'ъ-ь':'Разделительный Ъ','словарное':'Словарные слова','раз-роз':'РАЗ- и РОЗ-','расчёт':'РАСЧЁТ и РАССЧИТАТЬ',
      'пра-про':'ПРА- и ПРО-','дис-дез':'ДИС- и ДЕЗ-','нет приставки':'Слова без приставки',
      'суффикс наречия':'Суффиксы наречий -А и -О','прочее':'Прочее'};
    Object.keys(rules).sort((a,b)=>rules[b]-rules[a]).forEach(r => {
      list.push({ t:NAME[r]||r, c:rules[r], pick:() => RUS.filter(x=>x.rule===r) });
    });
  } else {
    list.push({ t:'Всё вперемешку', c:CHEM.length, pick:() => CHEM });
    list.push({ t:'Быстрый прогон — 25 вопросов', c:25, pick:() => shuffle(CHEM).slice(0,25) });
    const tp = {};
    CHEM.forEach(x => tp[x.topic] = (tp[x.topic]||0)+1);
    Object.keys(tp).forEach(t => list.push({ t:t, c:tp[t], pick:() => CHEM.filter(x=>x.topic===t) }));
  }

  $('#mlist').innerHTML = '';
  list.forEach((m,i) => {
    const b = document.createElement('button');
    b.className = 'mode';
    b.innerHTML = '<span class="mt">'+esc(m.t)+'</span><span class="mc">'+m.c+'</span>';
    b.onclick = () => start(m.pick());
    $('#mlist').appendChild(b);
  });
  show('modes');
}
function errPool(sub){
  const ids = ST.errors.filter(e => e.s === sub).map(e => e.i);
  const src = sub === 'rus' ? RUS : CHEM;
  return src.filter(x => ids.includes(x.id));
}

/* ===== прохождение ===== */
function start(pool){
  if (!pool || !pool.length) return;
  deck = shuffle(pool); pos = 0; score = 0; wrong = [];
  show('quiz'); render();
}

function render(){
  answered = false; picked = [];
  const q = deck[pos];
  $('#prog').style.width = (pos / deck.length * 100) + '%';
  $('#cnt').textContent = (pos+1) + ' / ' + deck.length;
  $('#fb').innerHTML = '';
  $('#next').classList.add('hide');

  if (subject === 'rus'){
    $('#qbody').innerHTML =
      '<div class="tag'+(q.dz?' dz':'')+'">'+(q.dz ? 'из ДЗ учителя' : q.src === 'ФИПИ' ? 'открытый банк ФИПИ' : 'тренировка')+'</div>'+
      '<div class="word">'+esc(q.word)+'</div>'+
      '<div class="claim">— '+esc(q.claim)+'</div>'+
      '<div class="hint">Верно ли объяснено написание выделенного слова?</div>';
    $('#answers').innerHTML = '<div class="pair">'+
      '<button class="btn" data-v="1">Верно</button>'+
      '<button class="btn" data-v="0">Неверно</button></div>';
    $('#answers').querySelectorAll('.btn').forEach(b => b.onclick = () => answerTF(b.dataset.v === '1'));
    return;
  }

  $('#qbody').innerHTML = '<div class="tag">'+esc(q.topic)+'</div><div class="chemq">'+esc(q.q)+'</div>'+
    (q.type === 'two' ? '<div class="hint">Выберите два верных ответа.</div>' :
     q.type === 'num' ? '<div class="hint">Введите ответ числом.</div>' : '');

  if (q.type === 'tf'){
    $('#answers').innerHTML = '<div class="pair">'+
      '<button class="btn" data-v="1">Верно</button>'+
      '<button class="btn" data-v="0">Неверно</button></div>';
    $('#answers').querySelectorAll('.btn').forEach(b => b.onclick = () => answerTF(b.dataset.v === '1'));
  } else if (q.type === 'num'){
    $('#answers').innerHTML = '<div class="numrow">'+
      '<input id="ni" inputmode="decimal" autocomplete="off" placeholder="'+(q.unit ? esc(q.unit) : 'ответ')+'">'+
      '<button class="go" id="nb">Ответить</button></div>';
    $('#nb').onclick = answerNum;
    $('#ni').addEventListener('keydown', e => { if (e.key === 'Enter') answerNum(); });
  } else {
    $('#answers').innerHTML = '<div class="opts">' +
      q.opts.map((o,i) => '<button class="btn" data-i="'+i+'">'+esc(o)+'</button>').join('') +
      '</div>' + (q.type === 'two' ? '<button class="go wide" id="cb">Ответить</button>' : '');
    $('#answers').querySelectorAll('.opts .btn').forEach(b => b.onclick = () => {
      if (answered) return;
      const i = +b.dataset.i;
      if (q.type === 'one'){ picked = [i]; answerChoice(); }
      else {
        const k = picked.indexOf(i);
        if (k >= 0) picked.splice(k,1); else if (picked.length < 2) picked.push(i);
        $('#answers').querySelectorAll('.opts .btn').forEach(x =>
          x.classList.toggle('pick', picked.includes(+x.dataset.i)));
      }
    });
    if (q.type === 'two') $('#cb').onclick = () => { if (picked.length === 2) answerChoice(); };
  }
}

function normNum(s){
  return String(s).trim().replace(',', '.').replace(/\s+/g,'').replace('−','-').replace('–','-')
         .replace(/^\+/, '').replace(/^(-?)0+(\d)/, '$1$2').replace(/\.0+$/, '');
}
function answerNum(){
  if (answered) return;
  const q = deck[pos], el = $('#ni'), v = el.value;
  if (!v.trim()) return;
  const ok = normNum(v) === normNum(q.ans);
  el.classList.add(ok ? 'good' : 'bad'); el.disabled = true; $('#nb').disabled = true;
  finish(ok, 'Правильный ответ: <b>' + esc(q.ans) + (q.unit ? ' ' + esc(q.unit) : '') + '</b>');
}
function answerTF(v){
  if (answered) return;
  const q = deck[pos], truth = q.ok;
  const ok = v === truth;
  $('#answers').querySelectorAll('.btn').forEach(b => {
    const bv = b.dataset.v === '1';
    b.disabled = true;
    if (bv === truth) b.classList.add('good');
    else if (bv === v) b.classList.add('bad');
  });
  finish(ok, 'Правильный ответ: <b>' + (truth ? 'Верно' : 'Неверно') + '</b>');
}
function answerChoice(){
  if (answered) return;
  const q = deck[pos], right = q.ans;
  const ok = picked.length === right.length && picked.every(i => right.includes(i));
  $('#answers').querySelectorAll('.opts .btn').forEach(b => {
    const i = +b.dataset.i; b.disabled = true; b.classList.remove('pick');
    if (right.includes(i)) b.classList.add('good');
    else if (picked.includes(i)) b.classList.add('bad');
  });
  const cb = $('#cb'); if (cb) cb.remove();
  finish(ok, 'Правильный ответ: <b>' + right.map(i => q.opts[i]).join(', ') + '</b>');
}

function finish(ok, rightLine){
  answered = true;
  const q = deck[pos];
  if (ok) score++; else wrong.push(q);
  ST.done++; if (ok) ST.right++;
  const key = { s:subject, i:q.id };
  const idx = ST.errors.findIndex(e => e.s === key.s && e.i === key.i);
  if (ok){ if (idx >= 0) ST.errors.splice(idx,1); }
  else if (idx < 0) ST.errors.push(key);
  save(); buzz(ok ? 'success' : 'error');

  $('#fb').innerHTML = '<div class="fb '+(ok?'ok':'no')+'">'+
    '<div class="h">'+(ok ? '✓ Правильно' : '✕ Ошибка')+'</div>'+
    (ok ? '' : '<div class="right">'+rightLine+'</div>')+
    '<div class="b" style="margin-top:'+(ok?'0':'8px')+'">'+esc(q.expl)+'</div></div>';
  $('#next').classList.remove('hide');
  $('#next').textContent = (pos+1 < deck.length) ? 'Следующее задание' : 'Показать результат';
}

$('#next').onclick = () => {
  pos++;
  if (pos < deck.length){ render(); return; }
  const pct = Math.round(score / deck.length * 100);
  $('#fscore').textContent = score + ' / ' + deck.length;
  $('#fpct').textContent = pct + '% верных ответов' + (pct >= 90 ? ' — отлично' : pct >= 70 ? ' — хорошо' : ' — стоит повторить');
  $('#againErr').classList.toggle('hide', wrong.length === 0);
  $('#mistakes').innerHTML = wrong.length
    ? '<h2>Разбор ошибок — '+plural(wrong.length,'задание','задания','заданий')+'</h2>' + wrong.map(q =>
        '<div class="card mist"><b>'+esc(subject==='rus' ? q.word : q.q)+'</b>'+
        (subject==='rus' ? '<div>— '+esc(q.claim)+'</div>' : '') +
        '<div class="m">'+esc(q.expl)+'</div></div>').join('')
    : '<div class="card mist" style="text-align:center">Ни одной ошибки. Так держать.</div>';
  show('done');
  buzz(wrong.length ? 'warning' : 'success');
};

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => openModes(b.dataset.go));
document.querySelectorAll('[data-back]').forEach(b => b.onclick = goBack);
function goBack(){
  if (!$('#quiz').classList.contains('hide')) openModes(subject);
  else { refreshHome(); show('home'); }
}
if (TG && TG.BackButton) TG.BackButton.onClick(() => {
  if (!$('#done').classList.contains('hide')) { refreshHome(); show('home'); }
  else goBack();
});
$('#again').onclick = () => start(deck);
$('#againErr').onclick = () => start(wrong);
$('#toHome').onclick = () => { refreshHome(); show('home'); };
$('#resetBtn').onclick = () => {
  if (!confirm('Обнулить статистику и список ошибок?')) return;
  ST = { done:0, right:0, errors:[] }; save(); refreshHome();
};

refreshHome(); show('home');
</script>
