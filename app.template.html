<title>Приставки и молекулы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#141D18; --ink-soft:#5D6A63; --line:#E0E7E2;
  --accent:#1F5E45; --accent-soft:#E4EEE8;
  --ok:#1B7A52; --ok-bg:#E3F2E9; --ok-line:#95D0B2;
  --no:#B03A31; --no-bg:#FAE8E5; --no-line:#EBA79F;
  --shadow:0 1px 1px rgba(20,29,24,.04), 0 6px 20px rgba(20,29,24,.05);
  --ui:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --word:"PT Serif",Georgia,"Times New Roman",serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--ui);
  padding:0 0 env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:23px;line-height:1.2;margin:6px 0 2px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;max-width:42ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- главный экран ---------- */
.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease}
.tile:active{transform:scale(.985)}
.tile .t{font-size:18px;font-weight:600;letter-spacing:-.01em}
.tile .d{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.tile .n{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.stats{display:flex;gap:8px;margin:16px 0 4px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink-soft)}

/* ---------- список режимов ---------- */
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.mode:active{background:#EFF3F0}
.mode .mt{font-weight:500;font-size:15.5px}
.mode .mc{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}

/* ---------- тренажёр ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid var(--line);background:var(--card);border-radius:11px;width:36px;height:36px;
  font-size:17px;line-height:1;cursor:pointer;color:var(--ink-soft);flex:none}
.bar{flex:1;height:7px;background:#DFE7E2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}

.qcard{padding:20px 18px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;margin-bottom:12px}
.tag.dz{color:#8A5A12;background:#FBF0DC}
.word{font-family:var(--word);font-size:25px;font-weight:700;letter-spacing:-.005em;line-height:1.2;margin:0 0 9px}
.claim{font-size:16.5px;line-height:1.55;max-width:44ch}
.chemq{font-size:17px;line-height:1.5;font-weight:500;max-width:44ch}
.hint{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* ---------- кнопки ответа ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:16px 12px;
  font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;color:var(--ink);
  transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pick{border-color:var(--accent);background:var(--accent-soft)}
.btn.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.btn.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.btn[disabled]{cursor:default}
.opts .btn{width:100%;text-align:left;margin-bottom:9px;font-weight:500;font-size:16px;padding:14px 15px;display:block}
.numrow{display:flex;gap:9px}
.numrow input{flex:1;min-width:0;font:inherit;font-size:19px;font-weight:600;padding:14px 16px;border-radius:15px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.numrow input:focus{outline:none;border-color:var(--accent)}
.numrow input.good{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.numrow input.bad{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.go{border:none;background:var(--accent);color:#fff;border-radius:15px;padding:14px 22px;font:inherit;
  font-size:16px;font-weight:600;cursor:pointer;flex:none}
.go:active{transform:scale(.97)}
.wide{width:100%;margin-top:12px}

/* ---------- разбор ---------- */
.fb{border-radius:var(--r);padding:15px 17px;margin-top:14px;border:1px solid;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--no-bg);border-color:var(--no-line)}
.fb .h{font-weight:700;font-size:15.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.fb.ok .h{color:var(--ok)} .fb.no .h{color:var(--no)}
.fb .b{font-size:15px;line-height:1.55}
.fb .right{margin-top:8px;font-size:15px}
.fb .right b{font-weight:700}

/* ---------- итоги ---------- */
.score{text-align:center;padding:26px 18px}
.score .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .pct{color:var(--ink-soft);margin-top:6px;font-size:14.5px}
.ghost{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;
  padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.mist{padding:14px 16px;margin-bottom:9px;font-size:14.5px;line-height:1.5}
.mist b{display:block;margin-bottom:3px}
.mist .m{color:var(--no);font-size:13.5px;margin-top:5px}
.hide{display:none!important}
.foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:22px;line-height:1.6}
</style>

<div class="wrap">
  <!-- ГЛАВНАЯ -->
  <div id="home">
    <h1>Приставки и молекулы</h1>
    <p class="sub">Два раздела к завтрашнему дню: приставки в задании 5 ОГЭ и повторение химии за 8 класс.</p>

    <button class="tile" data-go="rus">
      <div class="t">Русский язык</div>
      <div class="d">Правописание приставок. Верно или неверно объяснено написание слова.</div>
      <div class="n" id="nrus"></div>
    </button>

    <button class="tile" data-go="chem">
      <div class="t">Химия, 8 класс</div>
      <div class="d">Повторение: ОВР, степени окисления, классы веществ, строение атома, задачи.</div>
      <div class="n" id="nchem"></div>
    </button>

    <div class="stats">
      <div class="stat"><b id="s-all">0</b><span>решено всего</span></div>
      <div class="stat"><b id="s-pct">—</b><span>верных</span></div>
      <div class="stat"><b id="s-err">0</b><span>в ошибках</span></div>
    </div>
    <button class="ghost" id="resetBtn">Сбросить статистику</button>
    <div class="foot">Задания 5 взяты из открытого банка ФИПИ и дополнены по теории учителя.</div>
  </div>

  <!-- ВЫБОР РЕЖИМА -->
  <div id="modes" class="hide">
    <div class="top"><button class="back" data-back>‹</button><h2 id="mtitle" style="margin:0"></h2></div>
    <div id="mlist"></div>
  </div>

  <!-- ТРЕНАЖЁР -->
  <div id="quiz" class="hide">
    <div class="top">
      <button class="back" data-back>‹</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="count" id="cnt"></div>
    </div>
    <div class="card qcard" id="qbody"></div>
    <div id="answers"></div>
    <div id="fb"></div>
    <button class="go wide hide" id="next">Следующее задание</button>
  </div>

  <!-- ИТОГИ -->
  <div id="done" class="hide">
    <div class="card score">
      <div class="big" id="fscore"></div>
      <div class="pct" id="fpct"></div>
    </div>
    <button class="go wide" id="againErr">Работа над ошибками</button>
    <button class="ghost" id="again">Пройти ещё раз</button>
    <button class="ghost" id="toHome">На главную</button>
    <div id="mistakes" style="margin-top:20px"></div>
  </div>
</div>

<script>
/* ===== данные ===== */
const RUS = /*__RUS__*/[];
const CHEM = /*__CHEM__*/[];

/* ===== Telegram ===== */
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); if (TG.setHeaderColor) TG.setHeaderColor('#FBF9F6'); } catch(e){} }
function buzz(kind){ try{ TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(kind); }catch(e){} }

/* ===== состояние ===== */
const $ = s => document.querySelector(s);
const KEY = 'oge-trainer-v1';
let ST = { done:0, right:0, errors:[] };
try { ST = Object.assign(ST, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

let deck = [], pos = 0, score = 0, wrong = [], subject = 'rus', answered = false, picked = [];

function show(id){
  ['home','modes','quiz','done'].forEach(x => $('#'+x).classList.toggle('hide', x !== id));
  window.scrollTo(0,0);
  if (TG && TG.BackButton) { id === 'home' ? TG.BackButton.hide() : TG.BackButton.show(); }
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function plural(n, a, b, c){ const m=n%100, k=n%10; return n+' '+(m>=11&&m<=14 ? c : k===1 ? a : k>=2&&k<=4 ? b : c); }

function refreshHome(){
  $('#nrus').textContent = RUS.length + ' заданий';
  $('#nchem').textContent = CHEM.length + ' вопросов';
  $('#s-all').textContent = ST.done;
  $('#s-pct').textContent = ST.done ? Math.round(ST.right/ST.done*100) + '%' : '—';
  $('#s-err').textContent = ST.errors.length;
}

/* ===== режимы ===== */
function openModes(sub){
  subject = sub;
  $('#mtitle').textContent = sub === 'rus' ? 'Русский язык' : 'Химия, 8 класс';
  const list = [];
  const errs = ST.errors.filter(e => e.s === sub);
  if (errs.length) list.push({ t:'Работа над ошибками', c:errs.length, pick:() => errPool(sub) });

  if (sub === 'rus'){
    list.push({ t:'Все задания вперемешку', c:RUS.length, pick:() => RUS });
    list.push({ t:'Домашнее задание учителя', c:RUS.filter(x=>x.dz).length, pick:() => RUS.filter(x=>x.dz) });
    list.push({ t:'Только открытый банк ФИПИ', c:RUS.filter(x=>x.src==='ФИПИ').length, pick:() => RUS.filter(x=>x.src==='ФИПИ') });
    list.push({ t:'Быстрый прогон — 20 заданий', c:20, pick:() => shuffle(RUS).slice(0,20) });
    const rules = {};
    RUS.forEach(x => rules[x.rule] = (rules[x.rule]||0)+1);
    const NAME = {'з-с':'Приставки на З / С','пре-при':'ПРЕ- и ПРИ-','пол':'ПОЛ- и ПОЛУ-','по-дефис':'Наречия с ПО- через дефис',
      'ы-и':'Ы и И после приставок','местоимения':'Местоимения: НЕ, НИ, КОЕ-','неизм':'Неизменяемые приставки',
      'ъ-ь':'Разделительный Ъ','словарное':'Словарные слова','раз-роз':'РАЗ- и РОЗ-','расчёт':'РАСЧЁТ и РАССЧИТАТЬ',
      'пра-про':'ПРА- и ПРО-','дис-дез':'ДИС- и ДЕЗ-','нет приставки':'Слова без приставки',
      'суффикс наречия':'Суффиксы наречий -А и -О','прочее':'Прочее'};
    Object.keys(rules).sort((a,b)=>rules[b]-rules[a]).forEach(r => {
      list.push({ t:NAME[r]||r, c:rules[r], pick:() => RUS.filter(x=>x.rule===r) });
    });
  } else {
    list.push({ t:'Всё вперемешку', c:CHEM.length, pick:() => CHEM });
    list.push({ t:'Быстрый прогон — 25 вопросов', c:25, pick:() => shuffle(CHEM).slice(0,25) });
    const tp = {};
    CHEM.forEach(x => tp[x.topic] = (tp[x.topic]||0)+1);
    Object.keys(tp).forEach(t => list.push({ t:t, c:tp[t], pick:() => CHEM.filter(x=>x.topic===t) }));
  }

  $('#mlist').innerHTML = '';
  list.forEach((m,i) => {
    const b = document.createElement('button');
    b.className = 'mode';
    b.innerHTML = '<span class="mt">'+esc(m.t)+'</span><span class="mc">'+m.c+'</span>';
    b.onclick = () => start(m.pick());
    $('#mlist').appendChild(b);
  });
  show('modes');
}
function errPool(sub){
  const ids = ST.errors.filter(e => e.s === sub).map(e => e.i);
  const src = sub === 'rus' ? RUS : CHEM;
  return src.filter(x => ids.includes(x.id));
}

/* ===== прохождение ===== */
function start(pool){
  if (!pool || !pool.length) return;
  deck = shuffle(pool); pos = 0; score = 0; wrong = [];
  show('quiz'); render();
}

function render(){
  answered = false; picked = [];
  const q = deck[pos];
  $('#prog').style.width = (pos / deck.length * 100) + '%';
  $('#cnt').textContent = (pos+1) + ' / ' + deck.length;
  $('#fb').innerHTML = '';
  $('#next').classList.add('hide');

  if (subject === 'rus'){
    $('#qbody').innerHTML =
      '<div class="tag'+(q.dz?' dz':'')+'">'+(q.dz ? 'из ДЗ учителя' : q.src === 'ФИПИ' ? 'открытый банк ФИПИ' : 'тренировка')+'</div>'+
      '<div class="word">'+esc(q.word)+'</div>'+
      '<div class="claim">— '+esc(q.claim)+'</div>'+
      '<div class="hint">Верно ли объяснено написание выделенного слова?</div>';
    $('#answers').innerHTML = '<div class="pair">'+
      '<button class="btn" data-v="1">Верно</button>'+
      '<button class="btn" data-v="0">Неверно</button></div>';
    $('#answers').querySelectorAll('.btn').forEach(b => b.onclick = () => answerTF(b.dataset.v === '1'));
    return;
  }

  $('#qbody').innerHTML = '<div class="tag">'+esc(q.topic)+'</div><div class="chemq">'+esc(q.q)+'</div>'+
    (q.type === 'two' ? '<div class="hint">Выберите два верных ответа.</div>' :
     q.type === 'num' ? '<div class="hint">Введите ответ числом.</div>' : '');

  if (q.type === 'tf'){
    $('#answers').innerHTML = '<div class="pair">'+
      '<button class="btn" data-v="1">Верно</button>'+
      '<button class="btn" data-v="0">Неверно</button></div>';
    $('#answers').querySelectorAll('.btn').forEach(b => b.onclick = () => answerTF(b.dataset.v === '1'));
  } else if (q.type === 'num'){
    $('#answers').innerHTML = '<div class="numrow">'+
      '<input id="ni" inputmode="decimal" autocomplete="off" placeholder="'+(q.unit ? esc(q.unit) : 'ответ')+'">'+
      '<button class="go" id="nb">Ответить</button></div>';
    $('#nb').onclick = answerNum;
    $('#ni').addEventListener('keydown', e => { if (e.key === 'Enter') answerNum(); });
  } else {
    $('#answers').innerHTML = '<div class="opts">' +
      q.opts.map((o,i) => '<button class="btn" data-i="'+i+'">'+esc(o)+'</button>').join('') +
      '</div>' + (q.type === 'two' ? '<button class="go wide" id="cb">Ответить</button>' : '');
    $('#answers').querySelectorAll('.opts .btn').forEach(b => b.onclick = () => {
      if (answered) return;
      const i = +b.dataset.i;
      if (q.type === 'one'){ picked = [i]; answerChoice(); }
      else {
        const k = picked.indexOf(i);
        if (k >= 0) picked.splice(k,1); else if (picked.length < 2) picked.push(i);
        $('#answers').querySelectorAll('.opts .btn').forEach(x =>
          x.classList.toggle('pick', picked.includes(+x.dataset.i)));
      }
    });
    if (q.type === 'two') $('#cb').onclick = () => { if (picked.length === 2) answerChoice(); };
  }
}

function normNum(s){
  return String(s).trim().replace(',', '.').replace(/\s+/g,'').replace('−','-').replace('–','-')
         .replace(/^\+/, '').replace(/^(-?)0+(\d)/, '$1$2').replace(/\.0+$/, '');
}
function answerNum(){
  if (answered) return;
  const q = deck[pos], el = $('#ni'), v = el.value;
  if (!v.trim()) return;
  const ok = normNum(v) === normNum(q.ans);
  el.classList.add(ok ? 'good' : 'bad'); el.disabled = true; $('#nb').disabled = true;
  finish(ok, 'Правильный ответ: <b>' + esc(q.ans) + (q.unit ? ' ' + esc(q.unit) : '') + '</b>');
}
function answerTF(v){
  if (answered) return;
  const q = deck[pos], truth = q.ok;
  const ok = v === truth;
  $('#answers').querySelectorAll('.btn').forEach(b => {
    const bv = b.dataset.v === '1';
    b.disabled = true;
    if (bv === truth) b.classList.add('good');
    else if (bv === v) b.classList.add('bad');
  });
  finish(ok, 'Правильный ответ: <b>' + (truth ? 'Верно' : 'Неверно') + '</b>');
}
function answerChoice(){
  if (answered) return;
  const q = deck[pos], right = q.ans;
  const ok = picked.length === right.length && picked.every(i => right.includes(i));
  $('#answers').querySelectorAll('.opts .btn').forEach(b => {
    const i = +b.dataset.i; b.disabled = true; b.classList.remove('pick');
    if (right.includes(i)) b.classList.add('good');
    else if (picked.includes(i)) b.classList.add('bad');
  });
  const cb = $('#cb'); if (cb) cb.remove();
  finish(ok, 'Правильный ответ: <b>' + right.map(i => q.opts[i]).join(', ') + '</b>');
}

function finish(ok, rightLine){
  answered = true;
  const q = deck[pos];
  if (ok) score++; else wrong.push(q);
  ST.done++; if (ok) ST.right++;
  const key = { s:subject, i:q.id };
  const idx = ST.errors.findIndex(e => e.s === key.s && e.i === key.i);
  if (ok){ if (idx >= 0) ST.errors.splice(idx,1); }
  else if (idx < 0) ST.errors.push(key);
  save(); buzz(ok ? 'success' : 'error');

  $('#fb').innerHTML = '<div class="fb '+(ok?'ok':'no')+'">'+
    '<div class="h">'+(ok ? '✓ Правильно' : '✕ Ошибка')+'</div>'+
    (ok ? '' : '<div class="right">'+rightLine+'</div>')+
    '<div class="b" style="margin-top:'+(ok?'0':'8px')+'">'+esc(q.expl)+'</div></div>';
  $('#next').classList.remove('hide');
  $('#next').textContent = (pos+1 < deck.length) ? 'Следующее задание' : 'Показать результат';
}

$('#next').onclick = () => {
  pos++;
  if (pos < deck.length){ render(); return; }
  const pct = Math.round(score / deck.length * 100);
  $('#fscore').textContent = score + ' / ' + deck.length;
  $('#fpct').textContent = pct + '% верных ответов' + (pct >= 90 ? ' — отлично' : pct >= 70 ? ' — хорошо' : ' — стоит повторить');
  $('#againErr').classList.toggle('hide', wrong.length === 0);
  $('#mistakes').innerHTML = wrong.length
    ? '<h2>Разбор ошибок — '+plural(wrong.length,'задание','задания','заданий')+'</h2>' + wrong.map(q =>
        '<div class="card mist"><b>'+esc(subject==='rus' ? q.word : q.q)+'</b>'+
        (subject==='rus' ? '<div>— '+esc(q.claim)+'</div>' : '') +
        '<div class="m">'+esc(q.expl)+'</div></div>').join('')
    : '<div class="card mist" style="text-align:center">Ни одной ошибки. Так держать.</div>';
  show('done');
  buzz(wrong.length ? 'warning' : 'success');
};

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => openModes(b.dataset.go));
document.querySelectorAll('[data-back]').forEach(b => b.onclick = goBack);
function goBack(){
  if (!$('#quiz').classList.contains('hide')) openModes(subject);
  else { refreshHome(); show('home'); }
}
if (TG && TG.BackButton) TG.BackButton.onClick(() => {
  if (!$('#done').classList.contains('hide')) { refreshHome(); show('home'); }
  else goBack();
});
$('#again').onclick = () => start(deck);
$('#againErr').onclick = () => start(wrong);
$('#toHome').onclick = () => { refreshHome(); show('home'); };
$('#resetBtn').onclick = () => {
  if (!confirm('Обнулить статистику и список ошибок?')) return;
  ST = { done:0, right:0, errors:[] }; save(); refreshHome();
};

refreshHome(); show('home');
</script>
